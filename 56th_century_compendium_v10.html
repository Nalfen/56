<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>56th Century — Compendium v10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────── tokens ───────── */
:root{
  --ink:#101216;--panel:#16191f;--raised:#1b1f26;--raised2:#222732;
  --line:#262b34;--line2:#343b47;
  --text:#e9e7e2;--dim:#a3a9b4;--faint:#6b7280;
  --rust:#e07a4d;--rust-soft:rgba(224,122,77,.12);
  --teal:#5fd4c4;--teal-soft:rgba(95,212,196,.10);
  --cred:#7fd98a;--warn:#e8c468;--bad:#e8685f;--info:#6aa9f0;--psi:#bd8ef0;
  --r:10px;
  --font-d:'Chakra Petch',sans-serif;--font-b:'Atkinson Hyperlegible',sans-serif;--font-m:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.65;overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
mark{background:rgba(95,212,196,.25);color:var(--teal);border-radius:2px;padding:0 1px}

/* ───────── header ───────── */
header{height:56px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#menu-btn{display:none;width:38px;height:38px;border:1px solid var(--line2);border-radius:8px;font-size:18px;align-items:center;justify-content:center}
.logo{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.18em;white-space:nowrap}
.logo em{font-style:normal;color:var(--rust)}
.omni-trigger{flex:0 1 480px;display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;background:var(--raised);border:1px solid var(--line2);border-radius:8px;color:var(--faint);font-size:13.5px;transition:border-color .15s}
.omni-trigger:hover{border-color:var(--teal)}
.omni-trigger .kbd{margin-left:auto}
.kbd{font-family:var(--font-m);font-size:10.5px;color:var(--dim);background:var(--ink);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--font-m);font-size:11px;color:var(--faint);white-space:nowrap}
.status .led{width:7px;height:7px;border-radius:50%;background:var(--cred);box-shadow:0 0 6px var(--cred)}
.status b{color:var(--dim);font-weight:500}

/* ───────── layout / nav ───────── */
.layout{display:flex;flex:1;min-height:0}
nav.rail{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 24px}
.gum{margin-bottom:2px}
.gum>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-family:var(--font-d);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);cursor:pointer;user-select:none}
.gum>summary::-webkit-details-marker{display:none}
.gum>summary:hover{background:var(--raised);color:var(--text)}
.gum>summary .car{margin-left:auto;font-size:9px;color:var(--faint);transition:transform .15s}
.gum[open]>summary .car{transform:rotate(90deg)}
.nav-it{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px 7px 16px;border-radius:8px;font-size:14px;color:var(--dim);text-align:left;border-left:2px solid transparent}
.nav-it:hover{background:var(--raised);color:var(--text)}
.nav-it.active{background:var(--rust-soft);color:var(--rust);border-left-color:var(--rust);font-weight:700}
.nav-it .ct{margin-left:auto;font-family:var(--font-m);font-size:10.5px;color:var(--faint)}
.nav-it.active .ct{color:var(--rust)}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90}
main{flex:1;min-width:0;overflow-y:auto}
.page{max-width:1720px;margin:0 auto;padding:24px 40px 80px}
/* rules page uses the width: prose + sticky group TOC */
.rules-layout{display:grid;grid-template-columns:minmax(0,88ch) 230px;gap:48px;align-items:start}
.toc{position:sticky;top:96px;font-size:13px}
.toc .lbl{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.toc button{display:block;width:100%;text-align:left;padding:5px 0 5px 12px;color:var(--dim);border-left:2px solid var(--line);font-size:13px}
.toc button:hover{color:var(--rust);border-left-color:var(--rust)}
@media(max-width:1280px){.rules-layout{grid-template-columns:1fr}.toc{display:none}}
/* glossary fills wide screens with columns */
@media(min-width:1400px){.dlist.cols{columns:2;column-gap:56px;max-width:none}.dlist.cols .term{break-inside:avoid}}

/* ───────── section header / chips ───────── */
.shead{position:sticky;top:0;z-index:20;background:linear-gradient(var(--ink) 82%,transparent);padding:4px 0 12px;margin-bottom:4px}
.shead-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-left:3px solid var(--rust);padding-left:14px}
.crumb{font-family:var(--font-m);font-size:11px;color:var(--faint);letter-spacing:.06em}
.crumb b{color:var(--rust);font-weight:500}
h1{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:.04em}
.count-badge{font-family:var(--font-m);font-size:11.5px;color:var(--dim);background:var(--raised);border:1px solid var(--line2);border-radius:6px;padding:2px 9px;vertical-align:2px}
.shead-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.tool-btn{font-family:var(--font-m);font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:7px;padding:5px 11px;letter-spacing:.04em}
.tool-btn:hover{color:var(--teal);border-color:var(--teal)}
.tool-btn.on{color:var(--teal);border-color:var(--teal);background:var(--teal-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px;padding-left:17px;align-items:center}
.chip{font-size:13px;padding:5px 13px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);transition:all .12s}
.chip:hover{border-color:var(--dim);color:var(--text)}
.chip.on{background:var(--rust-soft);border-color:var(--rust);color:var(--rust);font-weight:700}
.scoped{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--raised);border:1px solid var(--line2);border-radius:99px;padding:4px 12px}
.scoped.solo{margin-left:0}
.scoped input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font-b);font-size:13px;width:160px}
.scoped svg{width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:2;flex-shrink:0}

/* ───────── cards ───────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.cards.compact{grid-template-columns:1fr;gap:0}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.cards.wide.compact{grid-template-columns:1fr}
.icard{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .12s,background .12s;position:relative;overflow:hidden}
.icard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rar,var(--line2))}
.icard:hover{border-color:var(--line2);background:var(--raised2)}
.icard[aria-expanded="true"]{border-color:var(--rar,var(--line2));background:var(--raised2)}
.cards.compact .icard{border-radius:0;border-left:none;border-right:none;border-top:none;padding:10px 16px}
.ic-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ic-name{font-weight:700;font-size:15.5px;letter-spacing:.01em}
.ic-cat{font-family:var(--font-m);font-size:11px;color:var(--faint)}
.ic-cost{margin-left:auto;font-family:var(--font-m);font-size:13px;color:var(--cred);white-space:nowrap}
.ic-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:52px}
.stat .k{font-family:var(--font-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--font-m);font-size:13.5px;color:var(--text);white-space:nowrap}
.v.pw-Low{color:var(--cred)}.v.pw-Medium{color:var(--warn)}.v.pw-High{color:var(--rust)}.v.pw-Extreme,.v.pw-EXTREME{color:var(--bad)}
.ic-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.t{font-family:var(--font-m);font-size:11px;padding:2px 9px;border-radius:5px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.t.spec{border-color:rgba(224,122,77,.4);color:var(--rust);background:var(--rust-soft);cursor:help}
.ic-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--dim);line-height:1.7}
.icard[aria-expanded="true"] .ic-body{display:block}
.ic-body p{margin-bottom:8px}
.ic-body .row{display:flex;gap:10px;padding:3px 0}
.ic-body .row .k{font-family:var(--font-m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rust);min-width:110px;padding-top:3px;flex-shrink:0}
.ic-body .row .v{flex:1;color:var(--text)}
.rar-COMMON{--rar:#4a5160}.rar-UNCOMMON{--rar:#5fae6e}.rar-RARE{--rar:#6aa9f0}.rar-LIMITED{--rar:#bd8ef0}.rar-UNIQUE{--rar:#e8c468}.rar-CLASSIFIED{--rar:#e8685f}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 4px;padding-left:17px;font-family:var(--font-m);font-size:10.5px;color:var(--faint)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;font-style:normal}
/* defense pills */
.defs{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.def{display:flex;align-items:center;gap:4px;font-family:var(--font-m);font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--line2)}
.def b{font-weight:600;color:var(--faint)}
.dt-NONE{color:#6b7280}.dt-LOW{color:#8fbf7f}.dt-MEDIUM{color:#7fd98a}.dt-HIGH{color:#e8c468}.dt-EXTREME{color:#e8685f}
/* simple definition rows (skills, glossary, keywords) */
.dlist{max-width:78ch}
.term{margin:0 0 14px}
.term dt{font-weight:700;font-size:14.5px;letter-spacing:.02em}
.term dt .t{margin-left:8px;vertical-align:2px}
.term dd{color:var(--dim);font-size:14.5px;line-height:1.75;margin-top:2px}
.term dd b{color:var(--text)}
/* rules */
.prose{max-width:88ch}
.rgroup{margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);overflow:hidden}
.rgroup>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 18px;font-family:var(--font-d);font-size:13.5px;font-weight:600;letter-spacing:.08em;cursor:pointer;user-select:none}
.rgroup>summary::-webkit-details-marker{display:none}
.rgroup>summary:hover{background:var(--raised2)}
.rgroup>summary .car{margin-left:auto;font-size:10px;color:var(--faint);transition:transform .15s}
.rgroup[open]>summary .car{transform:rotate(90deg)}
.rsec{padding:4px 20px 18px;border-top:1px solid var(--line)}
.rsec h3{font-family:var(--font-m);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);margin:16px 0 10px}
.re{color:var(--dim);font-size:14.5px;line-height:1.78;margin:0 0 11px}
.re b{color:var(--text)}
.rk{font-weight:700;font-size:14.5px;letter-spacing:.02em;margin-top:2px}
.rex{margin:6px 0 12px;padding:8px 12px;background:var(--ink);border-left:2px solid var(--teal);border-radius:0 6px 6px 0}
.rex .lbl{font-family:var(--font-m);font-size:9.5px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;margin-bottom:3px}
.rex li{font-family:var(--font-m);font-size:12.5px;color:var(--dim);list-style:none;padding:2px 0}
.rsub{font-style:italic;color:var(--faint);font-size:13.5px;margin:-6px 0 12px}
.note{margin-top:22px;padding:14px 18px;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0 var(--r) var(--r) 0;font-size:13.5px;color:var(--dim);max-width:74ch}
.note b{color:var(--teal)}
.empty{padding:50px 20px;text-align:center;color:var(--faint)}
/* manufacturer bar */
.mfr-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px;padding-left:17px}
.mfr-row label{font-family:var(--font-m);font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.mfr-sel{background:var(--raised);border:1px solid var(--line2);border-radius:7px;color:var(--text);font-family:var(--font-m);font-size:12px;padding:5px 10px;outline:none;cursor:pointer}
.mfr-sel:focus{border-color:var(--teal)}
.mfr-info{font-family:var(--font-m);font-size:11px;color:var(--dim)}
.defchoice{display:flex;gap:5px;align-items:center}
.dcc{font-family:var(--font-m);font-size:10.5px;padding:3px 9px;border-radius:5px;border:1px solid var(--line2);color:var(--dim)}
.dcc.on{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
/* loading / error */
#boot{position:fixed;inset:0;z-index:300;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#boot .logo{font-size:18px}
#boot .bar{width:240px;height:4px;border-radius:2px;background:var(--raised2);overflow:hidden}
#boot .fill{height:100%;width:0;background:var(--rust);transition:width .2s}
#boot .msg{font-family:var(--font-m);font-size:11px;color:var(--faint);max-width:480px;text-align:center;line-height:1.7;padding:0 20px;white-space:pre-line}
#boot.err .fill{background:var(--bad)}

/* ───────── palette ───────── */
#palette{display:none;position:fixed;inset:0;z-index:200;background:rgba(8,9,12,.7);backdrop-filter:blur(3px);padding:9vh 16px 0;justify-content:center;align-items:flex-start}
#palette.open{display:flex}
.pal{width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal-in svg{width:16px;height:16px;stroke:var(--rust);fill:none;stroke-width:2;flex-shrink:0}
.pal-in input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font-b);font-size:16px}
.pal-list{max-height:48vh;overflow-y:auto;padding:6px}
.pal-grp{font-family:var(--font-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:10px 14px 4px}
.pal-it{display:flex;align-items:center;gap:11px;width:100%;padding:8px 14px;border-radius:8px;text-align:left;font-size:14.5px}
.pal-it .meta{font-family:var(--font-m);font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.pal-it .sec{margin-left:auto;font-family:var(--font-m);font-size:10.5px;color:var(--faint);white-space:nowrap}
.pal-it.sel{background:var(--rust-soft)}
.pal-it.sel .nm{color:var(--rust);font-weight:700}
.pal-foot{display:flex;gap:16px;padding:9px 18px;border-top:1px solid var(--line);font-family:var(--font-m);font-size:10.5px;color:var(--faint)}

/* ───────── mobile ───────── */
@media(max-width:820px){
  #menu-btn{display:flex}
  .omni-trigger span.ph{display:none}
  .status{display:none}
  nav.rail{position:fixed;top:56px;left:0;bottom:0;z-index:95;transform:translateX(-105%);transition:transform .22s ease;width:266px;box-shadow:8px 0 30px rgba(0,0,0,.4)}
  nav.rail.open{transform:none}
  #overlay.show{display:block}
  .page{padding:18px 14px 90px}
  .cards,.cards.wide{grid-template-columns:1fr}
  .scoped{width:100%;margin:6px 0 0}
  .scoped input{flex:1;width:auto}
  h1{font-size:19px}
  .ic-body .row{flex-wrap:wrap}.ic-body .row .k{min-width:0}
}
</style>
</head>
<body>

<div id="boot">
  <div class="logo">56TH <em>CENTURY</em></div>
  <div class="bar"><div class="fill" id="boot-fill"></div></div>
  <div class="msg" id="boot-msg">Loading game data…</div>
</div>

<header>
  <button id="menu-btn" aria-label="Open navigation" onclick="toggleRail()">☰</button>
  <div class="logo">56TH <em>CENTURY</em></div>
  <button class="omni-trigger" onclick="openPal()" aria-label="Search the whole compendium">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span class="ph">Search everything…</span>
    <span class="kbd">Ctrl K</span>
  </button>
  <div class="status"><span class="led"></span><span>DATASET <b>v8</b></span><span>·</span><span id="st-domains"><b>—</b> DOMAINS</span><span>·</span><span id="st-entries"><b>—</b> ENTRIES</span></div>
</header>

<div class="layout">
<div id="overlay" onclick="toggleRail(false)"></div>
<nav class="rail" id="rail" aria-label="Compendium sections"></nav>
<main id="main"><div class="page" id="page"></div></main>
</div>

<div id="palette" role="dialog" aria-modal="true" aria-label="Search the compendium" onclick="if(event.target===this)closePal()">
  <div class="pal">
    <div class="pal-in">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="pal-q" type="text" placeholder="Search rules, gear, talents, spells, glossary…" autocomplete="off">
      <span class="kbd">ESC</span>
    </div>
    <div class="pal-list" id="pal-list"></div>
    <div class="pal-foot"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span><span style="margin-left:auto" id="pal-count"></span></div>
  </div>
</div>

<script>
"use strict";
/* ═════════ helpers ═════════ */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtCost(c){const n=parseInt(String(c).replace(/[^\d-]/g,""),10);return isNaN(n)?esc(c||"—"):n.toLocaleString("en-US")+" cr"}
function hlq(t,q){t=String(t==null?"":t);if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function stat(k,v,cls){if(v==null||v===""||v==="0 round(s)")return"";return `<div class="stat"><span class="k">${esc(k)}</span><span class="v ${cls||""}">${v}</span></div>`}
function row(k,v){if(!v)return"";return `<div class="row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`}
function rar(av){return "rar-"+String(av||"COMMON").toUpperCase().split(" ")[0]}
function defPill(lbl,tier){if(!tier)return"";const t=String(tier).toUpperCase();return `<span class="def"><b>${lbl}</b><span class="dt-${t}">${esc(t)}</span></span>`}
function specTags(s,q){if(!s)return"";return String(s).split(/\s+/).filter(Boolean).map(tok=>{
  const d=(g.specials&&(g.specials[tok]||g.specials[tok.toUpperCase()]))||"";
  return `<span class="t spec" title="${esc(typeof d==="string"?d:(d.desc||""))}">${hlq(tok,q)}</span>`}).join("")}
function lc(o,fields){return fields.map(f=>o[f]==null?"":String(o[f])).join(" ").toLowerCase()}
function optMult(c){const v=parseFloat(c||1);return "×"+(v===Math.floor(v)?v.toFixed(0):v.toFixed(2))+" cost"}
function optFlags(o){const f=(on,lbl)=>`<span class="t" style="${on==="1"?"":"opacity:.3"}">${lbl}</span>`;
  return f(o.armors,"AR")+f(o.forcefield,"FF")+f(o.datacom,"DC")+f(o.wpn_ranged,"RNG")+f(o.wpn_melee,"MLE")}

/* ═════════ data load ═════════ */
let g={};
(async function boot(){
  const fill=document.getElementById("boot-fill"),msg=document.getElementById("boot-msg");
  const bases=["data/v8/","data/",""];
  let base=null,man=null;
  for(const b of bases){
    try{const r=await fetch(b+"manifest.json");if(r.ok){man=await r.json();base=b;break}}catch(e){}
  }
  if(!man){
    document.getElementById("boot").classList.add("err");
    msg.textContent="Could not load game data (data/v8/manifest.json).\nThis page must be served over HTTP — not opened by double-clicking.\nLocal test: run  python -m http.server  in this folder,\nthen open http://localhost:8000/";
    return;
  }
  let done=0;
  await Promise.all(man.files.map(async fn=>{
    try{const d=await (await fetch(base+fn)).json();Object.assign(g,d)}
    catch(e){console.error("Failed:",fn,e)}
    done++;fill.style.width=Math.round(done/man.files.length*100)+"%";
    msg.textContent="Loading "+fn+"…";
  }));
  init();
  document.getElementById("boot").remove();
})();

const AVAIL=['COMMON','UNCOMMON','RARE','LIMITED','UNIQUE','CLASSIFIED'];
const POWER_STR={3:'Low',6:'Medium',9:'High',10:'High',11:'High',12:'High',13:'High',14:'High',15:'EXTREME',66:'LOC',77:'LOC+1'};
const DEF_TIER_MAP={0:'NONE',3:'LOW',6:'MEDIUM',9:'HIGH',12:'EXTREME'};
const DEF_NAME_TO_NUM={None:0,Low:3,Medium:6,High:9,Extreme:12,EXTREME:12,NONE:0,LOW:3,MEDIUM:6,HIGH:9};
function defShift(cur,mod){if(!mod)return cur;const b=DEF_NAME_TO_NUM[cur]||DEF_NAME_TO_NUM[String(cur)]||0;
  const c=Math.max(0,Math.min(12,b+mod));const s=[0,3,6,9,12].reduce((a,x)=>Math.abs(x-c)<Math.abs(a-c)?x:a);return DEF_TIER_MAP[s]||cur}
function shiftAvail(w,mod){if(!mod)return true;const i=AVAIL.indexOf(String(w.availability||'COMMON').toUpperCase().trim());
  const n=i+mod;if(n>=AVAIL.length)return false;w.availability=AVAIL[Math.max(0,n)];return true}
const WPN_MFRS=['Generic','Malivaux','Kintech','Nakamura','Arms Corp',"Zang'Hai",'TORC','Voran','Dilithium','Monomolecular'];
const WPN_MFRS_MELEE_ONLY=new Set(['Dilithium','Monomolecular']);
const ARMOR_MFRS=['Generic','Kintech','Harsh','Santech','BMS','Acer'];
const DATACOM_MFRS=['Generic','Securicorp','Orionworks','Biocom','Carnifex','Saiko','Yotoma',"Zang'Hai"];
const MEDICAL_MFRS=['Generic','Altair Biomed','RX Generic','Goodman Holistic','Diva Solutions','Mono-Med Customs'];
const mfrState={weapons:'Generic',armor:'Generic',datacoms:'Generic',medical:'Generic',kintechDef:'physical',dcDef:'physical'};

function applyWpnMfr(item,name){
  if(!name||name==='Generic')return item;
  if(WPN_MFRS_MELEE_ONLY.has(name)&&!MELEE.has(item.category))return item; // melee-only mfrs leave ranged untouched
  const m=(g.manufacturers||{})[name];if(!m)return item;
  const w={...item};
  if(!shiftAvail(w,parseInt(m.avail_mod||0)))return null;
  const pMod=parseInt(m.power_mod||0);
  if(pMod&&w.power_num){const nP=w.power_num+pMod;w.power=POWER_STR[nP]||w.power;w.power_num=nP}
  const maxMod=parseInt(m.max_dmg_mod||0),minMod=parseInt(m.min_dmg_mod||0);
  if((maxMod||minMod)&&w.max_dice!==undefined){
    const dice=w.max_dice+maxMod-w.min_dice-minMod,flat=w.min_dice+minMod;
    if(dice>=0&&flat>=0)w.damage=dice+'D + '+flat}
  const rM=parseFloat(m.range_mult||1);
  if(rM&&rM!==1)['range_short','range_med','range_long'].forEach(k=>{if(w[k])w[k]=String(Math.round(parseFloat(w[k])*rM))});
  const eM=parseInt(m.expertise_mod||0);
  if(eM&&w.expertise)w.expertise=String(Math.max(0,parseInt(w.expertise)+eM));
  const SZ=['Tiny','Small','Medium','Large'],szM=parseInt(m.size_mod||0);
  if(szM&&w.size){const si=SZ.findIndex(s=>s.toLowerCase()===String(w.size).toLowerCase());if(si>=0)w.size=SZ[Math.max(0,Math.min(SZ.length-1,si+szM))]}
  const pm=parseFloat(m.price_mult||1);if(pm&&pm!==1&&w.cost)w.cost=String(Math.round(parseFloat(w.cost)*pm));
  if(m.special)w.special=(w.special?w.special+' ':'')+m.special;
  if(m.abbr)w.name=w.name+' '+m.abbr;
  return w;
}
function applyArmorMfr(item,name){
  if(!name||name==='Generic')return item;
  const m=(g.manufacturers||{})[name];if(!m)return item;
  const w={...item};
  const pm=parseFloat(m.armor_price_mult||m.price_mult||1);
  if(pm&&pm!==1&&w.cost)w.cost=String(Math.round(parseFloat(w.cost)*pm));
  if(!shiftAvail(w,parseInt(m.avail_mod||0)))return null;
  [['pdef_mod','def_physical'],['edef_mod','def_energy'],['tdef_mod','def_tech'],['sdef_mod','def_spiritual']]
    .forEach(([mk,fk])=>{const v=parseInt(m[mk]||0);if(v)w[fk]=defShift(w[fk]||'NONE',v)});
  const smx=parseInt(m.soak_max_mod||0),smn=parseInt(m.soak_min_mod||0);
  if((smx||smn)&&w.soak_max!==undefined){const d=w.soak_max+smx-w.soak_min-smn,f=w.soak_min+smn;if(d>=0&&f>=0)w.soak=d+'D + '+f}
  if(m.armor_def_choice){
    const map={physical:'def_physical',energy:'def_energy',tech:'def_tech',spiritual:'def_spiritual'};
    const k=map[mfrState.kintechDef]||'def_physical';
    let b=defShift(w[k]||'NONE',3);if(b==='EXTREME')b='HIGH';w[k]=b;
    const ex=w.special||'';w.special=/\bOPT\b/.test(ex)?ex.replace(/\bOPT\b/,'OPT+'):(ex?ex+' OPT':'OPT');
  }else if(m.special)w.special=(w.special?w.special+' ':'')+m.special;
  if(m.abbr)w.name=w.name+' '+m.abbr;
  return w;
}
function applyDatacomMfr(item,name){
  if(!name||name==='Generic')return item;
  const m=(g.manufacturers||{})[name];if(!m)return item;
  const w={...item};
  const pm=parseFloat(m.price_mult||1);if(pm&&pm!==1&&w.cost)w.cost=String(Math.round(parseFloat(w.cost)*pm));
  if(!shiftAvail(w,parseInt(m.avail_mod||0)))return null;
  if(parseInt(m.cpu_mod||0)&&w.cpu_num!==undefined)w.cpu=String(w.cpu_num+parseInt(m.cpu_mod));
  if(parseInt(m.mem_mod||0)&&w.mem_num!==undefined)w.memory=String(w.mem_num+parseInt(m.mem_mod));
  if(parseInt(m.nan_mod||0)&&w.nan_num!==undefined)w.nanites=String(w.nan_num+parseInt(m.nan_mod));
  if(parseInt(m.sys_mod||0)&&w.system!=null)w.system=String((parseInt(w.system)||0)+parseInt(m.sys_mod));
  if(m.dc_def_choice){
    const map={physical:'def_physical',energy:'def_energy',tech:'def_tech',spiritual:'def_spiritual'};
    const k=map[mfrState.dcDef]||'def_physical';
    let b=defShift(w[k]||'NONE',3);if(b==='EXTREME')b='HIGH';w[k]=b;
  }
  if(parseInt(m.expertise_mod||0)&&w.exp_num!==undefined)w.expertise=String(w.exp_num+parseInt(m.expertise_mod));
  const SZ=['Tiny','Small','Medium','Large','Ex.Large'],szM=parseInt(m.size_mod||0);
  if(szM){const si=SZ.findIndex(s=>s.toLowerCase()===String(w.size||'').toLowerCase());if(si>=0)w.size=SZ[Math.max(0,Math.min(SZ.length-1,si+szM))]}
  const smx=parseInt(m.soak_max_mod||0),smn=parseInt(m.soak_min_mod||0);
  if((smx||smn)&&w.soak_max!==undefined){const d=w.soak_max+smx-w.soak_min-smn,f=w.soak_min+smn;if(d>=0&&f>=0)w.soak=d+'D + '+f}
  if(m.special)w.special=(w.special?w.special+' ':'')+m.special;
  if(m.abbr)w.name=w.name+' '+m.abbr;
  return w;
}
function applyMedMfr(item,name){
  if(!name||name==='Generic')return item;
  const m=(g.medical_manufacturers||{})[name];if(!m)return item;
  const w={...item};
  const SZ=['TINY','SMALL','MEDIUM','LARGE','EX.LARGE'],sM=parseInt(m.size_mod||0);
  if(sM){const si=SZ.indexOf(String(w.size||'TINY').toUpperCase());w.size=SZ[Math.max(0,Math.min(SZ.length-1,si+sM))]}
  if(name==='Mono-Med Customs')w.availability='UNIQUE';
  else if(!shiftAvail(w,parseInt(m.avail_mod||0)))return null;
  const tM=parseInt(m.tox_mod||0);if(tM&&w.toxicity!==undefined)w.toxicity=Math.max(0,(+w.toxicity||0)+tM);
  const pm=parseFloat(m.price_mult||1);if(pm&&pm!==1&&w.cost)w.cost=String(Math.round(parseFloat(w.cost)*pm));
  if(m.abbr)w.name=w.name+' '+m.abbr;
  return w;
}
function mfrDesc(name,kind){
  const m=kind==='medical'?(g.medical_manufacturers||{})[name]:(g.manufacturers||{})[name];
  if(!m)return'Standard generic stats';
  if(m.desc)return m.desc;
  const p=[];const add=(v,txt)=>{const n=parseFloat(v||0);if(n)p.push((n>0?'+':'')+n+' '+txt)};
  if(kind==='weapon'){
    add(m.power_mod,'power tier');add(m.max_dmg_mod,'max dmg');add(m.min_dmg_mod,'min dmg');add(m.expertise_mod,'expertise');
    const rM=parseFloat(m.range_mult||1);if(rM!==1)p.push('×'+rM+' range');
  }
  if(kind==='armor'){
    add(m.pdef_mod/3||0,'phys def');add(m.edef_mod/3||0,'energy def');add(m.tdef_mod/3||0,'tech def');add(m.sdef_mod/3||0,'spirit def');
    add(m.soak_max_mod,'max soak');add(m.soak_min_mod,'min soak');
    if(m.armor_def_choice)p.push('+1 chosen defense (max HIGH), adds OPT/OPT+');
  }
  if(kind==='datacom'){
    add(m.cpu_mod,'CPU');add(m.mem_mod,'MEM');add(m.nan_mod,'nanites');add(m.sys_mod,'system');add(m.expertise_mod,'expertise');
    add(m.soak_max_mod,'max soak');add(m.soak_min_mod,'min soak');
    if(m.dc_def_choice)p.push('+1 chosen defense (max HIGH)');
  }
  add(m.avail_mod,'avail tier');
  const pm=parseFloat((kind==='armor'&&m.armor_price_mult)?m.armor_price_mult:(m.price_mult||1));if(pm!==1)p.push('×'+pm+' cost');
  if(m.special&&!(kind==='armor'&&m.armor_def_choice))p.push('adds '+m.special);
  return p.length?p.join(' · '):'No stat modifications';
}

 cat:o=>o._kind,

{id:"spells",group:"Magic",label:"Spells",src:()=>g.spells||[],legend:true,

 hay:o=>lc(o,["name","type","skill","effect","minor","intermediate","major","mastery"]),
 card:(s,q)=>itemCard({name:s.name,cat:spellDomain(s),rail:rar(s.rarity),q,nameQ:q,

{id:"factions",group:"Galaxy",label:"Factions",src:()=>g.factions||[],wide:true,
 cats:()=>[...new Set((g.factions||[]).map(f=>f.category))].filter(Boolean),cat:o=>o.category,
 hay:o=>lc(o,["name","short","category","subcategory","alignment","desc","known_for"]),
 card:(f,q)=>itemCard({name:f.name,cat:f.short,q,nameQ:q,

];
const SEC_BY_ID=Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const GROUPS=["Reference","Characters","Arsenal","Tech & Gear","Magic","Galaxy"];

/* ═════════ state ═════════ */
const state={sec:null,cat:"",q:"",compact:{}};
function save(){try{localStorage.setItem("c10",JSON.stringify({sec:state.sec,compact:state.compact}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("c10"))||{}}catch(e){return{}}}

/* ═════════ generic card ═════════ */
function itemCard(o){
  const open=state._auto?' aria-expanded="true"':' aria-expanded="false"';
  return `<article class="icard ${o.rail||""}" tabindex="0" role="button"${o.body?open:' aria-expanded="false"'}>
    <div class="ic-top"><span class="ic-name">${hlq(o.name,o.nameQ)}</span>${o.cat?`<span class="ic-cat">${esc(o.cat)}</span>`:""}${o.cost?`<span class="ic-cost">${o.cost}</span>`:""}</div>
    ${o.stats?`<div class="ic-stats">${o.stats}</div>`:""}${o.extra||""}
    ${o.tags?`<div class="ic-tags">${o.tags}</div>`:""}
    ${o.body?`<div class="ic-body">${o.body}</div>`:""}
  </article>`;
}

/* ═════════ rendering ═════════ */
function shead(sec,count){
  return `<div class="shead"><div class="shead-row">
    <div><div class="crumb">${esc(sec.group.toUpperCase())} / <b>${esc(sec.label.toUpperCase())}</b></div>
    <h1>${esc(sec.label)} ${count!=null?`<span class="count-badge">${count}</span>`:""}</h1></div>
    ${sec.src?`<div class="shead-tools"><button class="tool-btn ${state.compact[sec.id]?"on":""}" id="density-btn" aria-pressed="${!!state.compact[sec.id]}">⊟ COMPACT</button></div>`:""}
  </div></div>`;
}
function chipsBar(sec){
  const cats=sec.cats?sec.cats():[];
  let h='<div class="chips">';
  if(cats.length){h+=`<button class="chip ${!state.cat?"on":""}" data-cat="">All</button>`;
    cats.forEach(c=>{h+=`<button class="chip ${state.cat===c?"on":""}" data-cat="${esc(c)}">${esc(sec.catLbl?sec.catLbl(c):c)}</button>`})}
  h+=`<label class="scoped ${cats.length?"":"solo"}"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="scoped-q" type="text" placeholder="Filter this list…" value="${esc(state.q)}" aria-label="Filter list"></label></div>`;
  return h;
}
const LEGEND='<div class="legend"><span><i style="background:#4a5160"></i>COMMON</span><span><i style="background:#5fae6e"></i>UNCOMMON</span><span><i style="background:#6aa9f0"></i>RARE</span><span><i style="background:#bd8ef0"></i>LIMITED</span><span><i style="background:#e8c468"></i>UNIQUE</span><span><i style="background:#e8685f"></i>CLASSIFIED</span></div>';

function mfrBar(sec){
  if(!sec.mfr)return"";
  const cur=mfrState[sec.mfr.key];
  let h=`<div class="mfr-row"><label>Manufacturer</label><select class="mfr-sel" data-mfrkey="${sec.mfr.key}">`+
    sec.mfr.list().map(m=>`<option value="${esc(m)}"${m===cur?" selected":""}>${esc(m)}</option>`).join("")+`</select>`;
  if(sec.mfr.defChoice&&sec.mfr.defChoiceWhen&&sec.mfr.defChoiceWhen(cur)){
    const curDef=mfrState[sec.mfr.defChoice];
    h+=`<span class="defchoice"><label>Boost</label>`+["physical","energy","tech","spiritual"].map(d=>
      `<button class="dcc ${curDef===d?"on":""}" data-defkey="${sec.mfr.defChoice}" data-def="${d}">${d.toUpperCase()}</button>`).join("")+`</span>`;
  }
  h+=`<span class="mfr-info">${esc(mfrDesc(cur,sec.mfr.kind))}</span></div>`;
  return h;
}
function renderCatalog(sec){
  const q=state.q.trim().toLowerCase();
  let all=sec.src();
  if(sec.mfr){const cur=mfrState[sec.mfr.key];if(cur&&cur!=="Generic")all=all.map(o=>sec.mfr.apply(o,cur)).filter(Boolean)}
  const inCat=o=>!state.cat||(sec.catTest?sec.catTest(o,state.cat):(sec.cat&&sec.cat(o)===state.cat));
  const F=all.filter(o=>inCat(o)&&(!q||sec.hay(o).includes(q)));
  const cap=sec.id==="codex"&&!q?60:1200;
  const shown=F.slice(0,cap);
  state._auto=!!q&&F.length<=3;
  let h=shead(sec,F.length)+mfrBar(sec)+chipsBar(sec);
  if(!F.length)h+=`<div class="empty">No matches. Try fewer letters, or search everything with <span class="kbd">Ctrl K</span>.</div>`;
  else{
    h+=`<div class="cards ${sec.wide?"wide":""} ${state.compact[sec.id]?"compact":""}" id="cards">`+shown.map(o=>sec.card(o,q)).join("")+"</div>";
    if(F.length>shown.length)h+=`<div class="empty">Showing first ${shown.length} of ${F.length} — type to narrow.</div>`;
    if(sec.legend)h+=LEGEND;
  }
  document.getElementById("page").innerHTML=h;
}

function renderRules(sec){
  const q=state.q.trim().toLowerCase();
  let h=shead(sec)+chipsBar({cats:()=>[]});
  const tocItems=[];
  h+='<div class="rules-layout"><div class="prose">';
  (g.rules_grouped||[]).forEach((grp,gi)=>{
    const secs=grp.sections.map(s=>({...s,entries:s.entries.filter(e=>!q||((e.key||"")+" "+(e.text||"")).toLowerCase().includes(q))})).filter(s=>s.entries.length);
    if(!secs.length)return;
    tocItems.push(["rg"+gi,grp.group]);
    h+=`<details class="rgroup" id="rg${gi}" ${gi===0||q?"open":""}><summary>${esc(grp.group)}<span class="car">▶</span></summary>`;
    secs.forEach(s=>{
      h+='<div class="rsec">';
      if(s.title&&s.title!==grp.group)h+=`<h3>${esc(s.title)}</h3>`;
      s.entries.forEach(e=>{
        if(e.key)h+=`<div class="rk">${hlq(e.key,q)}</div>`;
        h+=`<div class="re">${hlq(e.text,q)}</div>`;
        if(e.examples&&e.examples.length)h+=`<div class="rex"><div class="lbl">Examples</div>${e.examples.map(x=>`<li>${hlq(x,q)}</li>`).join("")}</div>`;
        if(e.sub)h+=`<div class="rsub">${hlq(e.sub,q)}</div>`;
      });
      h+='</div>';
    });
    h+='</details>';
  });
  // ── Hacking: full system + keywords live inside Rules ──
  const hrules=(g.hacking_rules||[]).filter(r=>!q||String(r).toLowerCase().includes(q));
  if(hrules.length){
    tocItems.push(["rg-hack","HACKING — FULL SYSTEM"]);
    h+=`<details class="rgroup" id="rg-hack" ${q?"open":""}><summary>HACKING — FULL SYSTEM<span class="car">▶</span></summary><div class="rsec">`;
    hrules.forEach(r=>{
      const m=String(r).match(/^([A-Z][A-Z &']+),\s*([\s\S]*)$/);
      if(m)h+=`<div class="rk">${hlq(m[1],q)}</div><div class="re">${hlq(m[2],q)}</div>`;
      else h+=`<div class="re">${hlq(r,q)}</div>`;
    });
    h+='</div></details>';
  }
  const hkw=(g.hacking_keywords||[]).filter(k=>!q||(k.term+" "+k.desc).toLowerCase().includes(q));
  if(hkw.length){
    tocItems.push(["rg-hkw","HACKING — KEYWORDS"]);
    h+=`<details class="rgroup" id="rg-hkw" ${q?"open":""}><summary>HACKING — KEYWORDS<span class="car">▶</span></summary><div class="rsec">`+
      hkw.map(k=>`<dl class="term"><dt>${hlq(k.term,q)}</dt><dd>${hlq(k.desc,q)}</dd></dl>`).join("")+'</div></details>';
  }
  h+='</div>';/* /prose */
  h+='<aside class="toc" aria-label="Rule groups"><div class="lbl">Rule groups</div>'+
    tocItems.map(([id,lbl])=>`<button data-jump="${id}">${esc(lbl)}</button>`).join("")+'</aside>';
  h+='</div>';/* /rules-layout */
  document.getElementById("page").innerHTML=h;
}

function renderAmmo(sec){
  const q=state.q.trim().toLowerCase();
  const types=(g.ammo_types||[]).filter(a=>!q||lc(a,["name","typical","options","legality"]).includes(q));
  const opts=(g.ammo_opts||[]).filter(o=>!q||lc(o,["code","name","effect","legality"]).includes(q));
  state._auto=!!q&&types.length<=3;
  let h=shead(sec,types.length)+chipsBar({cats:()=>[]});
  h+=`<div class="cards wide">`+types.map(a=>itemCard({name:a.name,cat:"CAT "+esc(a.cat||"—"),cost:fmtCost(a.cost),q,nameQ:q,
    stats:stat("Qty",esc(a.qty))+stat("Size",esc(a.size)),
    tags:String(a.options||"").split(/\s+/).filter(Boolean).map(c=>`<span class="t spec" title="${esc(((g.ammo_opts||[]).find(o=>o.code===c)||{}).effect||"")}">${esc(c)}</span>`).join("")+`<span class="t">${esc(a.legality)}</span>`,
    body:row("Typical",hlq(a.typical,q))})).join("")+"</div>";
  if(opts.length){
    h+=`<div class="prose" style="margin-top:18px"><details class="rgroup" open><summary>Ammo options<span class="car">▶</span></summary><div class="rsec">`+
      opts.map(o=>`<dl class="term"><dt>${hlq(o.code,q)} — ${hlq(o.name,q)}<span class="t" style="margin-left:8px">${esc(o.legality||"")}</span><span class="t" style="margin-left:4px">×${esc(o.cost_mult)} cost</span></dt><dd>${hlq(o.effect,q)}</dd></dl>`).join("")+
      `</div></details></div>`;
  }
  document.getElementById("page").innerHTML=h;
}

function renderEvolutions(sec){
  const q=state.q.trim().toLowerCase();
  const ev=g.evolutions||{};
  const F=(ev.grouped||[]).filter(e=>(!state.cat||e.evo_type===state.cat)&&
    (!q||(e.name+" "+e.evo_type+" "+Object.values(e.tiers||{}).map(t=>t.effect||"").join(" ")).toLowerCase().includes(q)));
  state._auto=!!q&&F.length<=3;
  let h=shead(sec,F.length)+chipsBar({cats:()=>["CYBERNETICS","GENETICS","MAGIC"]});
  if(!q){
    h+='<div class="prose" style="margin-bottom:16px">';
    if((ev.rules||[]).length)h+='<details class="rgroup"><summary>How evolution works<span class="car">▶</span></summary><div class="rsec">'+
      ev.rules.map(r=>`<div class="re">${esc(r)}</div>`).join("")+'</div></details>';
    if((ev.tier_notes||[]).length)h+='<details class="rgroup"><summary>Tier benefits &amp; drawbacks<span class="car">▶</span></summary><div class="rsec">'+
      ev.tier_notes.map(r=>`<div class="re">${esc(r)}</div>`).join("")+'</div></details>';
    if((ev.afflictions||[]).length)h+='<details class="rgroup"><summary>Afflictions (critical failure table)<span class="car">▶</span></summary><div class="rsec">'+
      ev.afflictions.map(a=>`<dl class="term"><dt><span class="t" style="margin-right:8px">${esc(a.roll)}</span>${esc(a.name)}</dt><dd>${esc(a.effect)}</dd></dl>`).join("")+'</div></details>';
    h+='</div>';
  }
  h+=`<div class="cards wide ${state.compact[sec.id]?"compact":""}" id="cards">`+F.map(e=>{
    const tiers=["TIER I","TIER II","TIER III"].filter(t=>e.tiers&&e.tiers[t]);
    const t1=e.tiers&&(e.tiers["TIER I"]||e.tiers[tiers[0]])||{};
    return itemCard({name:e.name,cat:e.evo_type,rail:rar(t1.availability),q,nameQ:q,
      tags:tiers.map(t=>`<span class="t">${esc(t)}</span>`).join(""),
      body:tiers.map(t=>{const x=e.tiers[t];
        return row(t,`<span class="ic-cost" style="margin:0 8px 0 0">${fmtCost(x.cost)}</span> <span class="t">${esc(x.availability||"")}</span> <span class="t">${esc(x.legality||"")}</span><br>${hlq(x.effect,q)}`)}).join("")});
  }).join("")+"</div>";
  if(!F.length)h+='<div class="empty">No matching evolutions.</div>';
  document.getElementById("page").innerHTML=h;
}

function renderGlossary(sec){
  const q=state.q.trim().toLowerCase();
  const F=(g.glossary_clean||[]).filter(o=>!q||sec.hay(o).includes(q));
  let h=shead(sec,F.length)+chipsBar({cats:()=>[]});
  h+='<div class="dlist cols">'+F.map(o=>`<dl class="term"><dt>${hlq(o.name,q)}</dt><dd>${hlq(o.desc,q)}</dd></dl>`).join("")+"</div>";
  if(!F.length)h+='<div class="empty">No matching terms.</div>';
  document.getElementById("page").innerHTML=h;
}

function renderSkills(sec){
  const q=state.q.trim().toLowerCase();
  let h=shead(sec)+chipsBar({cats:()=>[]});
  h+='<div class="prose">';
  if(g.skill_rules&&g.skill_rules.length&&!q){
    h+='<details class="rgroup"><summary>How skills work<span class="car">▶</span></summary><div class="rsec">'+
      g.skill_rules.map(r=>`<div class="re">${esc(typeof r==="string"?r:(r.text||""))}</div>`).join("")+'</div></details>';
  }
  ["Physical","Mental","Social","Acuity"].forEach(cat=>{
    const sk=(g.skills||[]).filter(s=>s.category===cat&&(!q||lc(s,["name","desc"]).includes(q)));
    if(!sk.length)return;
    h+=`<details class="rgroup" open><summary>${cat} skills<span class="car">▶</span></summary><div class="rsec">`+
      sk.map(s=>`<dl class="term"><dt>${hlq(s.name,q)}</dt><dd>${hlq(s.desc,q)}</dd></dl>`).join("")+'</div></details>';
  });
  h+='</div>';
  document.getElementById("page").innerHTML=h;
}


function render(){
  const sec=SEC_BY_ID[state.sec]||SECTIONS[0];
  if(sec.custom)sec.custom(sec);else renderCatalog(sec);
  document.getElementById("main").scrollTop=0;
}

/* ═════════ nav ═════════ */
function buildNav(){
  const rail=document.getElementById("rail");
  rail.innerHTML=GROUPS.map(grp=>{
    const items=SECTIONS.filter(s=>s.group===grp);
    return `<details class="gum" open><summary>${esc(grp)}<span class="car">▶</span></summary><div class="items">`+
      items.map(s=>{
        const n=s.src?s.src().length:(s.id==="glossary"?(g.glossary_clean||[]).length:null);
        return `<button class="nav-it" data-go="${s.id}">${esc(s.label)}${n?`<span class="ct">${n}</span>`:""}</button>`}).join("")+
      `</div></details>`;
  }).join("")+`<div class="note" style="margin:14px 8px 0;font-size:12px">GM tools (Enemy Generator, Character Creator, Drone Builder, Star Map) stay in the v9 build until restyled — <b>Milestone 11.2</b>.</div>`;
  rail.addEventListener("click",e=>{const b=e.target.closest(".nav-it");if(!b)return;go(b.dataset.go)});
}
function go(id,q){
  if(!SEC_BY_ID[id])id=SECTIONS[0].id;
  state.sec=id;state.cat="";state.q=q||"";
  document.querySelectorAll(".nav-it").forEach(b=>b.classList.toggle("active",b.dataset.go===id));
  if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);
  save();render();toggleRail(false);
  if(q){const inp=document.getElementById("scoped-q");if(inp)inp.focus()}
}
function toggleRail(force){
  const r=document.getElementById("rail"),o=document.getElementById("overlay");
  const open=force!==undefined?force:!r.classList.contains("open");
  r.classList.toggle("open",open);o.classList.toggle("show",open);
}

/* ═════════ palette ═════════ */
let PAL=[],palSel=0,palFlat=[];
function buildIndex(){
  PAL=[];
  SECTIONS.forEach(sec=>{
    let items=[];
    if(sec.index)items=sec.index().map(it=>({...it,go:sec.id,sec:sec.label}));
    else if(sec.src)items=sec.src().map(o=>({n:o.name||o.term||"",meta:(sec.cat?String(sec.cat(o)||""):""),hay:sec.hay(o),q:o.name,go:sec.id,sec:sec.label}));
    if(sec.id==="glossary")items=(g.glossary_clean||[]).map(o=>({n:o.name,meta:"glossary",hay:lc(o,["name","desc"]),q:o.name,go:"glossary",sec:"Glossary"}));
    if(items.length)PAL.push({g:sec.label,items,last:sec.id==="codex"});
  });
  PAL.sort((a,b)=>(a.last?1:0)-(b.last?1:0));
  const total=PAL.reduce((a,b)=>a+b.items.length,0);
  document.getElementById("st-domains").innerHTML="<b>"+Object.keys(g).length+"</b> DOMAINS";
  document.getElementById("st-entries").innerHTML="<b>"+total.toLocaleString("en-US")+"</b> ENTRIES";
  document.getElementById("pal-count").textContent="searches "+total.toLocaleString("en-US")+" entries";
}
function openPal(){document.getElementById("palette").classList.add("open");const q=document.getElementById("pal-q");q.value="";renderPal("");q.focus()}
function closePal(){document.getElementById("palette").classList.remove("open")}
function renderPal(q){
  palSel=0;palFlat=[];let html="";
  PAL.forEach(grp=>{
    const hits=q?grp.items.filter(it=>it.hay.includes(q)):grp.items.slice(0,3);
    if(!hits.length)return;
    html+=`<div class="pal-grp">${esc(grp.g)}</div>`;
    hits.slice(0,6).forEach(it=>{const idx=palFlat.length;palFlat.push(it);
      html+=`<button class="pal-it${idx===0?" sel":""}" data-pi="${idx}"><span class="nm">${hlq(it.n,q)}</span><span class="meta">${esc(it.meta||"")}</span><span class="sec">${esc(it.sec)} →</span></button>`});
  });
  document.getElementById("pal-list").innerHTML=html||'<div class="pal-grp" style="padding:18px 14px">No matches — try an item name, rule keyword, or skill.</div>';
}
function palGo(it){closePal();go(it.go,it.q||it.n)}

/* ═════════ init ═════════ */
function init(){
  window.C10={state,go,render,openPal,renderPal,data:g,mfrState};
  buildNav();buildIndex();
  const saved=load();state.compact=saved.compact||{};
  SECTIONS.forEach(s=>{if(s.defaultCompact&&state.compact[s.id]===undefined)state.compact[s.id]=true});
  const h=location.hash.slice(1);
  go(SEC_BY_ID[h]?h:(SEC_BY_ID[saved.sec]?saved.sec:"rules"));

  window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(SEC_BY_ID[id]&&id!==state.sec)go(id)});

  const page=document.getElementById("page");
  page.addEventListener("click",e=>{
    const jump=e.target.closest("[data-jump]");
    if(jump){const el=document.getElementById(jump.dataset.jump);
      if(el){el.open=true;el.scrollIntoView({behavior:"smooth",block:"start"})}return}
    const dcc=e.target.closest(".dcc[data-defkey]");
    if(dcc){mfrState[dcc.dataset.defkey]=dcc.dataset.def;render();return}
    const chip=e.target.closest(".chip");
    if(chip){state.cat=chip.dataset.cat;render();return}
    const db=e.target.closest("#density-btn");
    if(db){state.compact[state.sec]=!state.compact[state.sec];save();render();return}
    const card=e.target.closest(".icard");
    if(card&&card.querySelector(".ic-body")&&!e.target.closest("a"))
      card.setAttribute("aria-expanded",card.getAttribute("aria-expanded")!=="true");
  });
  page.addEventListener("keydown",e=>{
    if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("icard")){e.preventDefault();e.target.click()}
  });
  page.addEventListener("change",e=>{
    const sel=e.target.closest(".mfr-sel");
    if(sel){mfrState[sel.dataset.mfrkey]=sel.value;render()}
  });
  let t;page.addEventListener("input",e=>{
    if(e.target.id!=="scoped-q")return;    clearTimeout(t);const v=e.target.value;
    t=setTimeout(()=>{state.q=v;render();
      const inp=document.getElementById("scoped-q");
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}},120);
  });

  document.getElementById("pal-list").addEventListener("click",e=>{const b=e.target.closest(".pal-it");if(b)palGo(palFlat[+b.dataset.pi])});
  document.getElementById("pal-q").addEventListener("input",e=>renderPal(e.target.value.trim().toLowerCase()));
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();return}
    if(e.key==="/"&&!e.target.matches("input,textarea")){e.preventDefault();openPal();return}
    const pal=document.getElementById("palette");
    if(!pal.classList.contains("open"))return;
    if(e.key==="Escape"){closePal();return}
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      palSel=Math.max(0,Math.min(palFlat.length-1,palSel+(e.key==="ArrowDown"?1:-1)));
      document.querySelectorAll(".pal-it").forEach((b,i)=>b.classList.toggle("sel",i===palSel));
      const s=document.querySelector(".pal-it.sel");if(s)s.scrollIntoView({block:"nearest"});
    }
    if(e.key==="Enter"&&palFlat[palSel])palGo(palFlat[palSel]);
  });
}
</script>
</body>
</html>
