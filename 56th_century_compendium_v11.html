  return h;
}

function egGenId(){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let id='-';for(let i=0;i<19;i++)id+=chars[Math.floor(Math.random()*chars.length)];return id;
}

function egSkillLevel(v){
  v=parseInt(v)||0;
  if(v===0)return '0';
  if(v<=3)return 'novice';
  if(v<=6)return 'competent';
  if(v<=9)return 'master';
  return 'gmaster';
}

function egCalcResources(state=egState){
  const tier=state.tier;
  const base=EG_TIER_BASE[tier];
  const endur=parseInt(state.attrs.endurance)||0;
  const will=parseInt(state.attrs.willpower)||0;
  state.health=base.fixed?base.hp:base.hp+endur;
  state.morale=base.fixed?base.hp:base.hp+will;
  // chi: 0 unless mage
  const arch=EG_ARCHETYPES[state.archetype];
  if(!arch||!arch.chi){state.chi=0;return;}
  // mage chi based on armor lightness
  const ar=state.armors[0];
  let arType=ar?ar.type:'';
  if(!arType||arType===''){state.chi=Math.min(10,5+Math.floor(Math.random()*6));}
  else if(arType.toLowerCase().includes('light')){state.chi=3+Math.floor(Math.random()*6);}
  else if(arType.toLowerCase().includes('medium')){state.chi=1+Math.floor(Math.random()*5);}
  else{state.chi=Math.floor(Math.random()*3);}
  state.chi=Math.min(10,Math.max(0,state.chi));
}

function difficultyAvails(tier,difficulty){
  const base=EG_AVAIL_BY_TIER[tier]||['COMMON'];
  if(difficulty<=3) return base.filter(a=>['COMMON','UNCOMMON'].includes(a)).length?base.filter(a=>['COMMON','UNCOMMON'].includes(a)):['COMMON'];
  if(difficulty<=6) return base.filter(a=>['COMMON','UNCOMMON','RARE'].includes(a)).length?base.filter(a=>['COMMON','UNCOMMON','RARE'].includes(a)):['COMMON'];
  return base;
}

function egSkillValueForTier(tier,priority,difficulty){
  // priority: 1=primary, 0=secondary
  const ranges={henchmen:{p:[2,3],s:[1,2]},regular:{p:[4,5],s:[2,3]},elite:{p:[6,7],s:[4,5]},boss:{p:[8,9],s:[5,7]}};
  const r=ranges[tier]||ranges.regular;
  const [lo,hi]=priority?r.p:r.s;
  const diff=difficulty||egState.difficulty||5;
  // At diff 1: 60% of values; at diff 10: 100%
  const scale=0.6+0.4*(diff-1)/9;
  const scaledLo=Math.max(1,Math.round(lo*scale));
  const scaledHi=Math.max(scaledLo,Math.round(hi*scale));
  return scaledLo+Math.floor(Math.random()*(scaledHi-scaledLo+1));
}

function egSkillMinForTier(tier){
  if(tier==='henchmen') return 1;
  if(tier==='regular') return 1+Math.floor(Math.random()*2);
  if(tier==='elite') return 2+Math.floor(Math.random()*2);
  return 2+Math.floor(Math.random()*3);
}

function egAutoSkills(state=egState){
  const arch=EG_ARCHETYPES[state.archetype]||EG_ARCHETYPES.soldier;
  const tier=state.tier;
  const skills={};
  EG_SKILLS_ALL.forEach(s=>{ skills[s.key]=egSkillMinForTier(tier); });
  Object.entries(arch.skills).forEach(([k,priority])=>{
    skills[k]=egSkillValueForTier(tier,priority,state.difficulty||5);
  });
  state.skills=skills;
}

function egFilterWeapons(cats,overrideAvails,state=egState){
  const avails=overrideAvails||difficultyAvails(state.tier,state.difficulty||5);
  const legals=EG_LEGAL_BY_TIER[state.tier];
  return (g.weapons||[]).filter(w=>
    cats.includes(w.category)&&
    avails.includes(w.availability)&&
    legals.includes(w.legality)
  );
}

function egFilterArmor(armorType,overrideAvails,state=egState){
  const avails=overrideAvails||difficultyAvails(state.tier,state.difficulty||5);
  const typeMap={light:'Light Armor',medium:'Medium Armor',heavy:'Heavy Armor'};
  const t=typeMap[armorType]||'Light Armor';
  return (g.armor||[]).filter(a=>
    a.type===t&&
    avails.includes(a.availability)
  );
}

function egTryApplyWpnMfr(item,isMelee,state=egState){
  const avails=difficultyAvails(state.tier,state.difficulty||5);
  const validMfrs=WPN_MFRS.filter(m=>m!=='Generic'&&(!WPN_MFRS_MELEE_ONLY.has(m)||isMelee));
  const shuffled=validMfrs.slice().sort(()=>Math.random()-0.5);
  for(const mfr of shuffled){
    const modified=applyWpnMfr(item,mfr);
    if(!modified)continue;
    const modAv=(modified.availability||'COMMON').toUpperCase();
    if(avails.includes(modAv))return{item:modified,mfr};
  }
  return{item,mfr:'Generic'};
}

function egAutoGearWeapons(state=egState){
  const arch=EG_ARCHETYPES[state.archetype]||EG_ARCHETYPES.soldier;
  const wpnSkills=['Marksman','Gunslinger','Heavy Weapons','Melee Weapons','Larceny','Operator'];
  let bestSkill=null,bestVal=-1;
  wpnSkills.forEach(sk=>{const v=state.skills[sk]||0;if(v>bestVal){bestVal=v;bestSkill=sk;}});
  let cats=arch.weaponCats;
  if(bestSkill&&bestVal>=3&&EG_SKILL_WPN_CATS[bestSkill]) cats=EG_SKILL_WPN_CATS[bestSkill];
  const meleeCats=['Melee Weapons (Melee Weapons)','Powered Melee Weapons (Melee Weapons)'];
  const isMelee=cats.some(c=>meleeCats.includes(c));
  let pool=egFilterWeapons(cats,null,state);
  let primaryItem=null;
  if(pool.length>0){primaryItem=egPickTiered(pool,state.tier);}
  else{
    const fb=(g.weapons||[]).filter(w=>arch.weaponCats.includes(w.category));
    if(fb.length){primaryItem=egPickTiered(fb,state.tier);}
  }
  if(!primaryItem){state.weapons=[];return;}
  const{item:mfrItem,mfr}=egTryApplyWpnMfr(primaryItem,isMelee,state);
  const wpnState=egWpnToState(mfrItem);
  wpnState.mfr=mfr;
  wpnState._src=primaryItem;
  state.weapons=[wpnState];
  // ── Secondary weapon ──────────────────────────────────────────────────────
  const diff=state.difficulty||5;
  if(diff<=2)return;
  const sk=state.skills||{};
  const archKey=state.archetype;
  const pistolCats=['Pistols and Handguns (Gunslinger)','Auto pistols and S.M.G (Gunslinger)'];
  const primaryCat=primaryItem.category||'';
  const isPistolPrimary=pistolCats.includes(primaryCat);
  const isRangedPrimary=!meleeCats.includes(primaryCat);
  let secPool=null;
  if(EG_SECONDARY_RULES.dual_wield.includes(archKey)&&((sk.Gunslinger||0)>=4||(sk.Martial_Arts||0)>=4)&&diff>=4){
    secPool=egFilterWeapons(cats,null,state).filter(w=>w.name!==primaryItem.name);
  } else if(EG_SECONDARY_RULES.backup_sidearm.includes(archKey)&&(sk.Gunslinger||0)>=3&&!isPistolPrimary){
    secPool=egFilterWeapons(pistolCats,null,state);
  } else if(EG_SECONDARY_RULES.melee_backup.includes(archKey)&&isRangedPrimary&&(sk.Martial_Arts||0)>=3){
    secPool=egFilterWeapons(meleeCats,null,state);
  }
  if(secPool&&secPool.length){
    const secItem=egPickTiered(secPool,state.tier);
    if(secItem){
      const secIsMelee=meleeCats.includes(secItem.category||'');
      const{item:secMfrItem,mfr:secMfr}=egTryApplyWpnMfr(secItem,secIsMelee,state);
      const secState=egWpnToState(secMfrItem);
      secState.mfr=secMfr;
      secState._src=secItem;
      state.weapons.push(secState);
    }
  }
}

function egTryApplyArmorMfr(item,state=egState){
  const avails=difficultyAvails(state.tier,state.difficulty||5);
  const validMfrs=ARMOR_MFRS.filter(m=>m!=='Generic');
  const shuffled=validMfrs.slice().sort(()=>Math.random()-0.5);
  for(const mfr of shuffled){
    const modified=applyArmorMfr(item,mfr);
    if(!modified)continue;
    const modAv=(modified.availability||'COMMON').toUpperCase();
    if(avails.includes(modAv))return{item:modified,mfr};
  }
  return{item,mfr:'Generic'};
}

function egAutoGearArmors(state=egState){
  const arch=EG_ARCHETYPES[state.archetype]||EG_ARCHETYPES.soldier;
  const apool=egFilterArmor(arch.armorType,null,state);
  let baseArmor=null;
  if(apool.length>0){baseArmor=egPickTiered(apool,state.tier);}
  else{
    const t={light:'Light Armor',medium:'Medium Armor',heavy:'Heavy Armor'}[arch.armorType];

    if(af2.length){baseArmor=egPickTiered(af2,state.tier);}

  const{item:mfrItem,mfr}=egTryApplyArmorMfr(baseArmor,state);
  const arState=egArmorToState(mfrItem);
  arState.mfr=mfr;
  arState._src=baseArmor;
  state.armors=[arState];
}

function egAutoGear(state=egState){

}

function egWpnToState(w){
  const skill=EG_WPN_SKILL_MAP[w.category]||'Gunslinger';
  let dmgtarget='HEALTH';
  if(w.category===TEK_CAT||w.tek){
    // TEK frames need a loaded routine: keep one already applied, otherwise load a random one.
    if(!w.tek_routine){const rts=tekRoutines();if(rts.length)w=applyTekRoutine(w,rts[Math.floor(Math.random()*rts.length)].name);}
    const rt=tekRoutineByName(w.tek_routine);
    if(rt&&rt.dmgtarget)dmgtarget=rt.dmgtarget;
  }
  const catLabel=w.category.replace(/\s*\([^)]+\)/,'');
  return{name:w.name+(w.tek_routine?' ['+w.tek_routine+']':''),type:catLabel,dmgtype:w.dmg_type||w.type||'PHYSICAL',power:w.power||'Low',dmg:(w.damage||'').replace(/\s/g,''),expertise:w.expertise||'0',special:w.special||'',close_range:w.range_short||'0',medium_range:w.range_med||'0',long_range:w.range_long||'0',rof:w.rof||'',ammo:w.ammo||'0',reload:w.reload||'',skill:skill,dmgtarget:dmgtarget,_src:w};
}

function egArmorToState(a){
  return{name:a.name,type:a.type,def_phys:a.def_physical||'None',def_energy:a.def_energy||'None',def_tech:a.def_tech||'None',def_spirit:a.def_spiritual||'None',special:a.special||'',soak:(a.soak||'0D+0').replace(/\s/g,''),_src:a};

function egRandName(){
  const f=EG_NAMES_FIRST[Math.floor(Math.random()*EG_NAMES_FIRST.length)];

function egRaceShort(raceName){
  // "Non-Born (Hakari)" → "Hakari Non-Born"
  const m=raceName.match(/Non-Born\s*\(([^)]+)\)/i);
  if(m) return m[1]+' Non-Born';
  return raceName;
}

function egTierName(tier,race,archLabel){
  if(tier==='boss') return egRandName();
  const rs=egRaceShort(race);
  if(tier==='henchmen') return rs+' '+archLabel+' Henchmen';
  if(tier==='elite') return 'Elite '+rs+' '+archLabel;
  return rs+' '+archLabel;
}

function egPickRace(){
  const all=(g.races||[]).filter(r=>!r.npc);
  const base=all.filter(r=>!r.name.startsWith('Non-Born'));
  const nonBorn=all.filter(r=>r.name.startsWith('Non-Born'));
  // Equal weight: each base race is 1 slot, all non-borns together are 1 slot
  const total=base.length+(nonBorn.length>0?1:0);
  const idx=Math.floor(Math.random()*total);
  if(idx<base.length) return base[idx].name;
  // picked non-born group: pick sub-type uniformly
  return nonBorn[Math.floor(Math.random()*nonBorn.length)].name;
}

// Weighted pick biased toward higher availability for higher tiers
const EG_AVAIL_WEIGHT={COMMON:1,UNCOMMON:3,RARE:6,LIMITED:10,UNIQUE:12};
function egPickTiered(pool,tier){
  if(!pool||!pool.length) return null;
  // For henchmen/regular: flat random. For elite/boss: weight toward higher avail.
  if(tier==='henchmen'||tier==='regular') return pool[Math.floor(Math.random()*pool.length)];
  const tierBoost={elite:2,boss:4}[tier]||0;
  let total=0;
  const weighted=pool.map(item=>{
    const av=(item.availability||'COMMON').toUpperCase();
    const w=Math.pow(EG_AVAIL_WEIGHT[av]||1,1+tierBoost*0.3);
    total+=w;
    return{item,w};
  });
  let r=Math.random()*total;
  for(const{item,w} of weighted){r-=w;if(r<=0)return item;}
  return pool[pool.length-1];
}

function egAutoDatacom(state=egState){
  // Decide if this enemy should have a datacom
  const arch=EG_ARCHETYPES[state.archetype]||EG_ARCHETYPES.soldier;
  const hackingSkill=state.skills['Hacking']||0;
  if(!arch.isHacker&&hackingSkill<2){state.datacom=null;state.programs=[];state.gadgets=[];return;}
  const avails=EG_AVAIL_BY_TIER[state.tier];
  const legals=EG_LEGAL_BY_TIER[state.tier];
  // Filter: only Basic/Full Datacoms (not Networks)
  const dcPool=(g.datacoms||[]).filter(d=>
    (d.type==='Basic Datacom'||d.type==='Full Datacom')&&
    avails.includes(d.availability)&&
    legals.includes(d.legality)
  );
  if(!dcPool.length){state.datacom=null;state.programs=[];state.gadgets=[];return;}
  const dc=egPickTiered(dcPool,state.tier);
  state.datacom=dc;
  const memCap=parseInt(dc.memory)||1;
  const naniteCap=parseInt(dc.nanites)||0;
  // Build programs pool (not basic actions - those come from software.actions)
  const sw=g.software||{};
  const progPool=(sw.programs||[]).filter(p=>avails.includes(p.availability)&&legals.includes(p.legality));
  const gadPool=(sw.gadgets||[]).filter(g2=>avails.includes(g2.availability)&&(g2.legality==='No Permit'||g2.legality==='No permit'||legals.includes(g2.legality)));
  // Fill programs up to memory cap
  let usedMem=0;
  const picked=[];
  // Bias toward higher availability for elite/boss
  const sortedProgs=progPool.slice().sort((a,b)=>{
    const wa=EG_AVAIL_WEIGHT[(a.availability||'COMMON').toUpperCase()]||1;
    const wb=EG_AVAIL_WEIGHT[(b.availability||'COMMON').toUpperCase()]||1;
    return wb-wa;
  });
  const maxProgs=1+Math.floor(Math.random()*3); // 1-3 programs
  for(const p of sortedProgs){
    if(picked.length>=maxProgs) break;
    const mem=parseInt(p.memory)||1;
    if(usedMem+mem<=memCap){usedMem+=mem;picked.push(p);}
  }
  state.programs=picked;
  // Fill gadgets if nanite cap > 0 and memory allows
  state.gadgets=[];
  if(naniteCap>0){
    const sortedGads=gadPool.slice().sort((a,b)=>{
      const wa=EG_AVAIL_WEIGHT[(a.availability||'COMMON').toUpperCase()]||1;
      const wb=EG_AVAIL_WEIGHT[(b.availability||'COMMON').toUpperCase()]||1;
      return wb-wa;
    });
    const maxGads=1+Math.floor(Math.random()*3); // 1-3 gadgets
    for(const gad of sortedGads){
      if(state.gadgets.length>=maxGads) break;
      const mem=parseInt(gad.memory)||1;
      if(usedMem+mem<=memCap){usedMem+=mem;state.gadgets.push(gad);}
    }
  }
}

function egRandomizeState(state=egState){
  if(!state.locks.tier) state.tier=EG_TIER_ORDER[Math.floor(Math.random()*EG_TIER_ORDER.length)];
  if(!state.locks.race) state.race=egPickRace();
  if(!state.locks.archetype){const archKeys=Object.keys(EG_ARCHETYPES);state.archetype=archKeys[Math.floor(Math.random()*archKeys.length)];}
  const _arch=EG_ARCHETYPES[state.archetype]||EG_ARCHETYPES.soldier;
  if(!state.locks.name) state.name=egTierName(state.tier,state.race,_arch.label);
  // Randomize attrs within racial range, skewed by tier
  const raceObj=(g.races||[]).find(r=>r.name===state.race)||{stats:{}};
  const rs=raceObj.stats||{};
  const tier=state.tier;
  const diff=state.difficulty||5;
  ['physical','acuity','mental','social','endurance','speed','wits','willpower'].forEach(k=>{
    if(state.locks.attrs[k]) return;
    const s=rs[k]||{};
    const mn=parseInt(s.min)||0,av=parseInt(s.avg)||0,mx=parseInt(s.max)||0;
    if(tier==='henchmen'){state.attrs[k]=mn+Math.floor(Math.random()*(Math.max(av,mn)-mn+1));}
    else{
      const range=mx-mn;
      const t=(diff-1)/9;
      const lo=mn+Math.floor(0.5*t*range);
      const hi=Math.min(mx,mn+Math.floor((0.2+0.8*t)*range));
      state.attrs[k]=lo+Math.floor(Math.random()*(Math.max(hi,lo)-lo+1));
    }
  });
  if(!state.locks.skills) egAutoSkills(state);
  if(!state.locks.weapons) egAutoGearWeapons(state);
  if(!state.locks.armors) egAutoGearArmors(state);
  if(!state.locks.consumables) egAutoConsumables(state);
  if(!state.locks.talentsevos) egAutoTalentsEvos(state);
  if(!state.locks.datacom) egAutoDatacom(state);
  if(!state.locks.loot) egAutoLoot(state);
  egCalcResources(state);
}

function egAutoTalentsEvos(state=egState){
  const tier=state.tier;
  const archKey=state.archetype;
  if(tier==='henchmen'){state.talents=[];state.evolution=null;return;}
  // ── Find dominant skill category ──────────────────────────────────────────
  const cats=['Physical','Mental','Social','Acuity'];
  let dominantCat='Physical',dominantTotal=0;
  cats.forEach(cat=>{
    const total=EG_SKILLS_ALL.filter(s=>s.cat===cat).reduce((sum,s)=>sum+(state.skills[s.key]||0),0);
    if(total>dominantTotal){dominantTotal=total;dominantCat=cat;}
  });
  // Map category name to talent category key (capitalised differently)
  const catMap={Physical:'PHYSICAL',Mental:'MENTAL',Social:'SOCIAL',Acuity:'ACUITY'};
  const talentCat=catMap[dominantCat]||'PHYSICAL';
  // Fallback to archetype-preferred cats if dominant has no talents
  const archCats=(EG_ARCH_TALENT_CATS[archKey]||['PHYSICAL']);
  // ── Per-category skill totals used as talent point limits ─────────────────
  const catLimits={};
  cats.forEach(cat=>{
    const total=EG_SKILLS_ALL.filter(s=>s.cat===cat).reduce((sum,s)=>sum+(state.skills[s.key]||0),0);
    catLimits[catMap[cat]||cat.toUpperCase()]=total;
  });
  // ── Greedy fill: pick highest-cost talent that fits per category ─────────
  const diff=state.difficulty||5;
  const maxPasses=Math.max(1,Math.round(diff/3));
  state.talents=[];
  const catSpent={};
  const usedIds=new Set();
  const allTalents=(g.talents||[]).filter(t=>{
    const cat=t.category;
    if(!(cat===talentCat||archCats.includes(cat)))return false;
    return egTalentMatchesRace(t,state.race);
  });
  for(let pass=0;pass<maxPasses;pass++){
    // Only pick a talent if its category's skill total has room for the cost
    const eligible=allTalents.filter(t=>{
      if(usedIds.has(t.name))return false;
      const cost=parseInt(t.cost);if(!cost||cost<5)return false;
      const limit=catLimits[t.category]||0;
      const spent=catSpent[t.category]||0;
      return spent+cost<=limit;
    });
    if(!eligible.length) break;
    const _costWeights={5:40,10:30,15:20,20:8,25:4};
    const _pool=[];eligible.forEach(t=>{const w=_costWeights[parseInt(t.cost)]||1;for(let _wi=0;_wi<w;_wi++)_pool.push(t);});
    const picked=_pool[Math.floor(Math.random()*_pool.length)];
    state.talents.push(picked);
    usedIds.add(picked.name);
    catSpent[picked.category]=(catSpent[picked.category]||0)+parseInt(picked.cost);
  }
  if(!state.talents.length){
    // Fallback: one 5-pt talent from archetype cats (respect per-category limit)
    const fb=(g.talents||[]).filter(t=>archCats.includes(t.category)&&parseInt(t.cost)===5&&(catLimits[t.category]||0)>=5&&egTalentMatchesRace(t,state.race));
    if(fb.length) state.talents=[fb[Math.floor(Math.random()*fb.length)]];
  }
  // ── Evolution ───────────────────────────────────────────────────────────────
  const evoTypes=EG_ARCH_EVO_TYPES[archKey]||['GENETICS'];
  const allGrouped=(g.evolutions&&g.evolutions.grouped)||[];
  const eligibleEvos=allGrouped.filter(grp=>{
    if(!evoTypes.includes(grp.evo_type)||!grp.tiers||!grp.tiers['TIER I'])return false;
    const t1=grp.tiers['TIER I'];
    const av=(t1.availability||'COMMON').toUpperCase();
    if(diff<=3){return ['COMMON','UNCOMMON'].includes(av);}
    if(diff<=6){return !['UNIQUE'].includes(av);}
    return true;
  });
  if(eligibleEvos.length>0){
    state.evolution=eligibleEvos[Math.floor(Math.random()*eligibleEvos.length)];
  } else {
    state.evolution=null;
  }
}

function egAutoConsumables(state=egState){
  const tier=state.tier;
  const diff=state.difficulty||5;
  const avails=difficultyAvails(tier,diff);
  const archKey=state.archetype;
  const legalProfile=EG_CONSUMABLE_LEGAL[archKey]||{prefer:['No Permit'],allow:['Restricted'],illegalChance:0.1};
  const medItems=(g.medical||[]).filter(m=>{
    const av=(m.availability||'COMMON').toUpperCase();
    return avails.includes(av);
  });
  const preferPool=medItems.filter(m=>legalProfile.prefer.includes(m.legality));
  const allowPool=medItems.filter(m=>legalProfile.allow.includes(m.legality)&&!legalProfile.prefer.includes(m.legality));
  if(!preferPool.length&&!allowPool.length){state.consumables=[];return;}
  let maxCount;
  if(tier==='henchmen')maxCount=Math.floor(Math.random()*2);
  else if(tier==='regular')maxCount=1+Math.floor(Math.random()*2);
  else maxCount=1+Math.floor(Math.random()*3);
  const picked=[];
  const usedNames=new Set();
  for(let i=0;i<maxCount;i++){
    const useIllegal=allowPool.length>0&&Math.random()<legalProfile.illegalChance;
    const pool=(useIllegal?allowPool:preferPool).filter(m=>!usedNames.has(m.name));
    if(!pool.length){
      const fallback=(useIllegal?preferPool:allowPool).filter(m=>!usedNames.has(m.name));
      if(!fallback.length)continue;
      const item=egPickTiered(fallback,tier);
      if(item){picked.push(item);usedNames.add(item.name);}
      continue;
    }
    const item=egPickTiered(pool,tier);
    if(item){picked.push(item);usedNames.add(item.name);}
  }
  state.consumables=picked;
}

function egSpecialDesc(specialStr){
  if(!specialStr||!g.specials)return specialStr||'';
  return specialStr.split(/[,\/]/).map(s=>{
    const trimmed=s.trim();
    const key=trimmed.replace(/[()]/g,'').split(' ')[0];
    const sp=g.specials[key]||g.specials[key.toUpperCase()]||g.specials[key.toLowerCase()];
    if(sp&&sp.desc)return trimmed+': '+sp.desc;
    return trimmed;
  }).join(' | ');
}

function egTalentMatchesRace(t,raceName){
  const req=(t.req||'0').trim();
  if(req==='0'||!req)return true;
  const raceNames=new Set((g.races||[]).map(r=>r.name.toUpperCase()));
  const parts=req.toUpperCase().split(/\s+OR\s+/);
  const isRaceReq=parts.some(p=>raceNames.has(p.trim()));
  if(!isRaceReq)return true;
  const raceUp=(raceName||'').toUpperCase();
  return parts.some(p=>p.trim()===raceUp);
}

function egAutoLoot(state=egState){
  const tier=state.tier;
  const diff=state.difficulty||5;
  const archKey=state.archetype;
  // ── Credits ───────────────────────────────────────────────────────────────
  const creditRanges={henchmen:[100,500,50],regular:[500,2000,100],elite:[1500,6000,500],boss:[5000,30000,1000]};
  const cr=creditRanges[tier]||creditRanges.regular;
  const rawAmt=cr[0]+Math.floor(Math.random()*(cr[1]-cr[0]+1));
  const mult=Math.min(1.30,0.7+0.06*diff);
  const denom=cr[2];
  const finalAmt=Math.round(rawAmt*mult/denom)*denom;
  const gangTypes=['gang_enforcer','gang_smuggler','gang_hitman','assassin','brawler'];
  const blankChance=gangTypes.includes(archKey)?0.70:0.30;
  const credType=Math.random()<blankChance?'blanks':'credstick';
  const credDC=credType==='credstick'?Math.min(9,Math.max(2,Math.round(2*(Math.log10(Math.max(1,finalAmt))-1)))):null;
  // ── Items ─────────────────────────────────────────────────────────────────
  const avails=difficultyAvails(tier,diff);
  const legals=EG_LEGAL_BY_TIER[tier];
  const carryableSizes=['Tiny','Small','Medium','',null,undefined];
  const pool=(g.equipment||[]).filter(item=>{
    if(!EQUIPMENT_LOOT_CATEGORIES.includes(item.category))return false;
    if(!carryableSizes.includes(item.size))return false;
    const av=(item.availability||'COMMON').toUpperCase();
    if(!avails.includes(av))return false;
    if(item.legality&&!legals.includes(item.legality))return false;
    return true;
  });
  // Archetype category weights
  const catWeights={};
  const combatArchs=['soldier','heavy','mil_infantry','mil_heavy','mil_spec_ops','mil_engineer'];
  if(combatArchs.includes(archKey)){catWeights['Tools & Crafting']=2;catWeights['Survival Gear']=2;}
  else if(archKey==='hacker'){catWeights['Tools & Crafting']=2;catWeights['Licenses & Documents']=2;}
  else if(archKey==='mage'){catWeights['Consumables, Tobacco, Stimulants & Recreational']=2;}
  else if(['gang_enforcer','gang_smuggler','gang_hitman'].includes(archKey)){catWeights['Consumables, Tobacco, Stimulants & Recreational']=2;catWeights['Consumables, Alcohol']=2;}
  else if(['corp_guard','corp_agent','corp_executive'].includes(archKey)){catWeights['Licenses & Documents']=2;catWeights['Clothing']=2;}
  // Weighted sample without replacement
  const countRanges={henchmen:[0,1],regular:[1,2],elite:[2,3],boss:[2,4]};
  const cr2=countRanges[tier]||[1,2];
  const count=cr2[0]+Math.floor(Math.random()*(cr2[1]-cr2[0]+1));
  const items=[];
  const usedNames=new Set();
  // Build weighted pool
  const weightedPool=[];
  pool.forEach(item=>{
    const w=catWeights[item.category]||1;
    for(let i=0;i<w;i++) weightedPool.push(item);
  });
  for(let i=0;i<count&&weightedPool.length>0;i++){
    // Remove already used
    const filtered=weightedPool.filter(it=>!usedNames.has(it.name));
    if(!filtered.length)break;
    const picked=filtered[Math.floor(Math.random()*filtered.length)];
    items.push({name:picked.name,category:picked.category,effect:picked.effect||'',legality:picked.legality||'No Permit',cost:picked.cost||0});
    usedNames.add(picked.name);
  }
  // 15% chance of a flavour memento
  if(Math.random()<0.15){
    const m=LOOT_MEMENTOS[Math.floor(Math.random()*LOOT_MEMENTOS.length)];
    items.push({name:m,category:'Memento',effect:'',legality:'No Permit',cost:0});
  }
  state.loot={credits:{amount:finalAmt,type:credType,dc:credDC},items};
}

function egGenerateGroup(){
  const tmpl=EG_GROUP_TEMPLATES[egGroupState.template];
  if(!tmpl)return;
  const totalCount=Math.max(2,Math.min(8,egGroupState.enemyCount||4));
  const difficulty=egGroupState.difficulty||5;
  const enemies=[];
  // Resolve slot counts
  let fixed=0;
  const resolvedSlots=tmpl.slots.map(slot=>{
    if(slot.count!==-1){fixed+=slot.count;return{...slot,resolvedCount:slot.count};}
    return{...slot,resolvedCount:0};
  });
  const remaining=Math.max(1,totalCount-fixed);
  resolvedSlots.forEach(slot=>{if(slot.count===-1)slot.resolvedCount=remaining;});
  resolvedSlots.forEach(slot=>{
    for(let i=0;i<slot.resolvedCount;i++){
      const st=egFreshState();
      st.difficulty=difficulty;
      st.tier=slot.tier;
      st.archetype=slot.archetypes[Math.floor(Math.random()*slot.archetypes.length)];
      // Set race
      st.race=egPickRace();
      // Set name
      const _arch=EG_ARCHETYPES[st.archetype]||EG_ARCHETYPES.soldier;
      st.name=egTierName(st.tier,st.race,_arch.label);
      // Set attrs from race
      const raceObj=(g.races||[]).find(r=>r.name===st.race)||{stats:{}};
      const rs=raceObj.stats||{};
      const diff=(st.difficulty-1)/9;
      ['physical','acuity','mental','social','endurance','speed','wits','willpower'].forEach(k=>{
        const s=rs[k]||{};
        const mn=parseInt(s.min)||0,mx=parseInt(s.max)||0;
        const range=mx-mn;
        const lo=mn+Math.floor(0.5*diff*range);
        const hi=Math.min(mx,mn+Math.floor((0.2+0.8*diff)*range));
        if(st.tier==='henchmen'){const av=parseInt(s.avg)||0;st.attrs[k]=mn+Math.floor(Math.random()*(Math.max(av,mn)-mn+1));}
        else{st.attrs[k]=lo+Math.floor(Math.random()*(Math.max(hi,lo)-lo+1));}
      });
      egAutoSkills(st);
      egAutoGearWeapons(st);
      egAutoGearArmors(st);
      egAutoConsumables(st);
      egAutoTalentsEvos(st);
      egAutoDatacom(st);
      egAutoLoot(st);
      egCalcResources(st);
      st._role=slot.role;
      enemies.push(st);
    }
  });
  egGroupState.enemies=enemies;
}

      if(c.legality)tags.push(_gmE(c.legality));
      if(c.availability)tags.push(_gmE(c.availability));
      if(c.application)tags.push('Apply: '+_gmE(c.application));
      if(tags.length)gmHtml+='<p><strong>['+tags.join(' / ')+']</strong></p>\n';
      if(c.effect||c.desc)gmHtml+='<blockquote><p>'+_gmE(c.effect||c.desc)+'</p></blockquote>\n';
      if(c.toxicity&&parseInt(c.toxicity))gmHtml+='<p><em>Toxicity: '+_gmE(c.toxicity)+'</em></p>\n';
    });
    gmHtml+='<hr>\n';
  }
  // Loot block
  if(state.loot){
    const loot=state.loot;
    gmHtml+='<h2><strong>LOOT</strong></h2>\n';
    const _lootCredLabel=loot.credits.type==='blanks'?'BLANKS — untraceable cash':'CREDSTICK — Hacking DC '+(loot.credits.dc||2)+' to unlock';
    gmHtml+='<p><strong>Credits: '+fmt(loot.credits.amount)+' Cr ['+_gmE(_lootCredLabel)+']</strong></p>\n';
    if((loot.items||[]).length){
      gmHtml+='<ul>\n';
      loot.items.forEach(it=>{
        gmHtml+='<li>'+_gmE(it.name)+(it.category&&it.category!=='Memento'?' ('+_gmE(it.category)+') — '+_gmE(it.legality):'')+(it.category==='Memento'?' <em>(Memento)</em>':'')+'</li>\n';
      });
      gmHtml+='</ul>\n';
    }
    gmHtml+='<hr>\n';
  }
  const _archForExp=EG_ARCHETYPES[state.archetype]||EG_ARCHETYPES.soldier;
  if(_archForExp.isMage){
    gmHtml+='<h2><strong>SPIRIT / SPELLS</strong></h2>\n';
    gmHtml+='<p>[Placeholder — spirit and spell selection will be implemented when the compendium spirit/spell data is finalised]</p>\n';
  }
  const charId=egGenId();
  const _drop=attribs.filter(o=>!CC_SHEET_ATTRS.has(o.name)).map(o=>o.name);
  if(_drop.length)try{console.warn('[export] dropped '+_drop.length+' attr(s) not on Roll20 sheet:',_drop.join(', '));}catch(e){}
  const out={schema_version:3,type:'character',character:{oldId:charId,name:state.name,avatar:'',bio:'',gmnotes:encodeURIComponent(gmHtml),defaulttoken:'',tags:'[]',controlledby:'',inplayerjournals:'',attribs:attribs.filter(o=>CC_SHEET_ATTRS.has(o.name)),abilities:[]}};
  const blob=new Blob([JSON.stringify(out,null,4)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a2=document.createElement('a');
  a2.href=url;a2.download=(state.name||'enemy').replace(/\s+/g,'_')+'.json';
  document.body.appendChild(a2);a2.click();
  setTimeout(()=>{document.body.removeChild(a2);URL.revokeObjectURL(url);},500);
}

        html+='<div class="rkv"><div class="rk">WHERE YOUR GEAR COMES FROM</div><div class="rv">Almost everything you can buy in the 56th Century is, strictly speaking, a knockoff. The Tronik Wars gutted the great design databases - the blueprints, the exact specifications, the records of who owned what and, crucially, which facility was ever licensed to build it. When the dust settled, that knowledge was simply gone. The base version of every item in this compendium is one of those orphaned designs: a generic, unbranded make, assembled from half-remembered specs and good-enough tolerances.</div></div>';
        html+='<div class="rkv"><div class="rk">A MILLION SUB-MANUFACTURERS</div><div class="rv">Into that vacuum poured millions of small sub-manufacturers, each stamping out gear from whatever patchwork of leaked, salvaged, or reverse-engineered blueprints they could assemble. A generic pistol fires; a generic vest stops a knife. It simply carries no name, no guarantee, and no two batches are ever quite identical. For most people in the slums, generic is the only word that matters - and the only price they can pay.</div></div>';
        html+='<div class="rkv"><div class="rk">THE CORPORATE CATALOGUES</div><div class="rv">The great corporations are the exception, and this is where a manufacturer actually comes in. Each named maker keeps its own proprietary catalogue - jealously guarded specs, controlled fabrication, a house style - for customers discerning (and wealthy) enough to want the real thing. Choosing a manufacturer means buying the branded, catalogue-grade version of an item instead of the generic knockoff: cleaner performance, a signature quirk or two, and a price and rarity to match.</div></div>';

        html+='<div class="rkv"><div class="rk">FOR THE PLAYER</div><div class="rv">Run generic when you are broke, anonymous, or just need the thing to work; pay for a manufacturer when the edge, the prestige, or the signature property is worth the higher cost and the harder-to-find availability. A branded weapon also says something about you - who you bank with, who you owe, who you want to be seen carrying.</div></div>';

      var t=(p.type||'').toLowerCase();

      if(a.indexOf('breathable')!==-1)return false;

      if(t.indexOf('dyson')!==-1)return false;
      return true;

// Uses DOMContentLoaded so smap-popup (defined after the closing script tag) exists in DOM.
document.addEventListener('DOMContentLoaded',function(){
  var popup=document.getElementById('smap-popup');
  if(!popup)return;
  var pdrag=false,pdx=0,pdy=0,ppl=0,ppt=0;
  popup.addEventListener('mousedown',function(e){
    if(!e.target.closest('.smap-popup-name'))return;
    if(e.button!==0)return;
    pdrag=true;
    pdx=e.clientX;pdy=e.clientY;
    ppl=parseInt(popup.style.left)||0;
    ppt=parseInt(popup.style.top)||0;
    popup.style.userSelect='none';
    e.preventDefault();e.stopPropagation();
  });
  document.addEventListener('mousemove',function(e){
    if(!pdrag)return;
    var vw=window.innerWidth,vh=window.innerHeight;
    var nl=ppl+e.clientX-pdx,nt=ppt+e.clientY-pdy;
    popup.style.left=Math.max(0,Math.min(nl,vw-popup.offsetWidth))+'px';
    popup.style.top=Math.max(0,Math.min(nt,vh-popup.offsetHeight))+'px';
  });
  document.addEventListener('mouseup',function(){
    if(pdrag){pdrag=false;popup.style.userSelect='';}
  });
});

function omniIndex(){

  add('skills','Skills',g.skills,function(o){return o.name},function(o){return o.category},function(o){return o.desc});
  add('talents','Talents',g.talents,function(o){return o.name},function(o){return o.category});
  add('races','Races',g.races,function(o){return o.name});
  add('backgrounds','Backgrounds',g.backgrounds,function(o){return o.name},function(o){return o.race});

  add('evolutions','Evolutions',(g.evolutions||{}).grouped,function(o){return o.name},function(o){return o.evo_type});
  add('weapons','Weapons',g.weapons,function(o){return o.name},function(o){return o.category});
  add('weapon_options','Weapon Options',(g.options||[]).filter(function(o){return o.wpn_ranged==='1'||o.wpn_melee==='1'}),function(o){return o.name});
  add('armor','Armor',g.armor,function(o){return o.name},function(o){return o.category});
  add('armor_options','Armor Options',(g.options||[]).filter(function(o){return o.armors==='1'||o.forcefield==='1'||o.datacom==='1'}),function(o){return o.name});
  add('ammo','Ammunition',g.ammo_types,function(o){return o.name},function(o){return o.cat});

  var sw=g.software||{};

  add('equipment','Equipment',g.equipment,function(o){return o.name},function(o){return o.category});
  add('medical','Medical',g.medical,function(o){return o.name});
  add('glossary_only','Special Properties',Object.keys(g.specials||{}).map(function(k){var v=g.specials[k]||{};return {k:k,nm:v.name,d:v.desc}}),function(o){return o.k},function(o){return o.nm},function(o){return o.d});
  var cat=g.catalog||{};

function hlq(s,q){var e=esc(s),i=e.toLowerCase().indexOf(q);if(i<0)return e;return e.slice(0,i)+'<b>'+e.slice(i,i+q.length)+'</b>'+e.slice(i+q.length);}
function renderPal(q){
  q=(q||'').trim().toLowerCase();
  var ix=omniIndex(),res=document.getElementById('pal-res'),out='';
  palHits=[];
  if(!q){res.innerHTML='<div class="pal-hint">Type to search '+ix.length.toLocaleString()+' entries across every section — rules, gear, talents, ships, factions…</div>';document.getElementById('pal-cnt').textContent=ix.length.toLocaleString()+' entries';return;}
  var byG={},order=[];
  for(var i=0;i<ix.length;i++){var e=ix[i];if(e.h.indexOf(q)<0)continue;if(!byG[e.l]){byG[e.l]=[];order.push(e.l);}if(byG[e.l].length<6)byG[e.l].push(e);}
  if(!order.length){res.innerHTML='<div class="pal-hint">No matches for “'+esc(q)+'”.</div>';document.getElementById('pal-cnt').textContent='0 results';return;}
  if(palIdx<0)palIdx=0;
  order.forEach(function(l){
    out+='<div class="pal-g">'+esc(l)+'</div>';
    byG[l].forEach(function(e){
      var k=palHits.length;palHits.push(e);
      out+='<div class="pal-it'+(k===palIdx?' sel':'')+'" data-pi="'+k+'"><span class="pal-n">'+hlq(e.n,q)+'</span>'+(e.m?'<span class="pal-m">'+esc(e.m)+'</span>':'')+'</div>';
    });
  });
  if(palIdx>=palHits.length)palIdx=palHits.length-1;
  res.innerHTML=out;document.getElementById('pal-cnt').textContent=palHits.length+' shown';
  var sel=res.querySelector('.pal-it.sel');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}

// ── v11.2: cross-reference clickable table items ──
var XREF=null;
function xrefMap(){
  if(XREF)return XREF;
  XREF=new Map();
  omniIndex().forEach(function(e){var k=e.n.toLowerCase();var a=XREF.get(k);if(a){a.push(e);}else{XREF.set(k,[e]);}});
  return XREF;
}
// Resolve a name to ONE xref target, preferring an entry in the preferred section.
// Fixes cross-domain name collisions (e.g. the "Unity"/"Doom" hacking program vs the
// same-named spell): a cell in the hacking section now resolves to the hacking entry.
function xrefResolve(k,preferSec){
  var a=xrefMap().get(k);if(!a||!a.length)return null;
  if(preferSec){for(var i=0;i<a.length;i++){if(a[i].s===preferSec)return a[i];}}
  return a[0];
}
function xrefDecorate(){
  var main=document.getElementById('main');if(!main)return;
  var sel='table.stab td:first-child,table.eq-tab td:first-child,table.opt-table td:first-child,table.evo-aff-table td:first-child';
  main.querySelectorAll(sel).forEach(function(td){
    if(td.classList.contains('xref')||td.querySelector('button,input,select,a'))return;
    var t=(td.textContent||'').trim();
    if(!t||t.length<3||/^[\d\s.,%xX+\u00d7-]+$/.test(t))return;
    var e=xrefResolve(t.toLowerCase(),cs);
    if(!e){var t2=t.replace(/\s*\([^)]*\)\s*$/,'');if(t2!==t){e=xrefResolve(t2.toLowerCase(),cs);}}
    if(!e)return;
    if(e.s===cs&&sq===e.n.toLowerCase())return;
    td.classList.add('xref');td.dataset.xs=e.s;td.dataset.xn=e.n;td.title='Open: '+e.n;
  });
}
var _v11Render=render;
render=function(){_v11Render();try{xrefDecorate();}catch(e){}};
// Fetch the target item's real card by rendering its section invisibly, then restoring the view.
function xrefFetchCard(sec,name){
  var main=document.getElementById('main');
  var keep={cs:cs,sq:sq,af:af,html:main.innerHTML,scroll:main.scrollTop,act:main.dataset.activeSection};
  var html='';
  try{
    cs=sec;sq=String(name).toLowerCase();af='';
    _v11Render();
    var nl=String(name).trim().toLowerCase(),card=null;
    var nodes=main.querySelectorAll('.card');
    for(var i=0;i<nodes.length;i++){var cn=nodes[i].querySelector('.cn');var t=cn?cn.textContent.trim().toLowerCase():'';if(t===nl){card=nodes[i];break;}}
    if(!card)for(var i=0;i<nodes.length;i++){var cn=nodes[i].querySelector('.cn');var t=cn?cn.textContent.trim().toLowerCase():'';if(t.indexOf(nl)>=0){card=nodes[i];break;}}
    if(!card&&nodes.length===1)card=nodes[0];
    if(!card){
      var rkvs=main.querySelectorAll('.rkv');
      for(var i=0;i<rkvs.length;i++){var rk=rkvs[i].querySelector('.rk');var t=rk?rk.textContent.trim().toLowerCase():'';if(t===nl||t.indexOf(nl)>=0){card=rkvs[i];break;}}
    }
    if(card){card.classList.add('x');html=card.outerHTML;}
    else{
      // card-less targets (ammo types/options, weapon/armor options, ...): extract the table row
      var exact=null,loose=null;
      var cells=main.querySelectorAll('table td');
      for(var i=0;i<cells.length;i++){var t=(cells[i].textContent||'').trim().toLowerCase();if(t===nl){exact=cells[i];break;}if(!loose&&t.indexOf(nl)>=0)loose=cells[i];}
      var hit=exact||loose;
      if(hit){
        var row=hit.closest('tr'),tb=hit.closest('table');
        if(row&&tb){
          var head=tb.querySelector('thead');
          html='<div class="tbl-wrap"><table class="'+(tb.className||'stab')+' xref-mini">'+(head?'<thead>'+head.innerHTML+'</thead>':'')+'<tbody>'+row.outerHTML+'</tbody></table></div>';
        }
      }
    }
  }catch(e){}
  cs=keep.cs;sq=keep.sq;af=keep.af;
  main.innerHTML=keep.html;
  if(keep.act!==undefined)main.dataset.activeSection=keep.act;
  main.scrollTop=keep.scroll;
  return html;
}

  tr.parentNode.insertBefore(nr,tr.nextSibling);
});

// ── v11.2: star map faction influence areas ──
var smapInfHidden=(function(){try{return localStorage.getItem('smap_inf_hide')==='1';}catch(e){return false;}})();
function smapHull(pts){
  var p=pts.slice().sort(function(a,b){return a.x-b.x||a.y-b.y;});
  function cross(o,a,b){return (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);}
  var lo=[],up=[];
  p.forEach(function(pt){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],pt)<=0)lo.pop();lo.push(pt);});
  p.slice().reverse().forEach(function(pt){while(up.length>=2&&cross(up[up.length-2],up[up.length-1],pt)<=0)up.pop();up.push(pt);});
  lo.pop();up.pop();
  var hull=lo.concat(up);
  return hull.length>=3?hull:p;
}
function smapSmoothClosed(pts){
  if(pts.length<3)return '';
  var d='M'+pts[0].x.toFixed(2)+','+pts[0].y.toFixed(2);
  var n=pts.length;
  for(var i=0;i<n;i++){
    var p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    var c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    var c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+='C'+c1x.toFixed(2)+','+c1y.toFixed(2)+' '+c2x.toFixed(2)+','+c2y.toFixed(2)+' '+p2.x.toFixed(2)+','+p2.y.toFixed(2);
  }
  return d+'Z';
}
function smapInfluenceBlobs(){
  var pos=smapPosLoad();
  var groups={};
  function reg(r){return String(r||'').split(/[,/]/)[0].trim();}
  (g.catalogue_systems||[]).forEach(function(s){
    var p=pos[s.name];if(!p)return;
    var r=reg(s.region);if(!r||r==='Others')return;
    (groups[r]=groups[r]||[]).push({x:p.x,y:p.y});
  });
  (g.galaxy||[]).filter(function(e){return e.entry_type==='faction';}).forEach(function(f){
    var p=pos[f.name];if(!p)return;
    var r=reg(f.name);
    if(groups[r])groups[r].push({x:p.x,y:p.y});
  });
  var names=Object.keys(groups).filter(function(r){return smapRegionColor(r)!=='#aeaeb2';});
  var AS=1.493; // map aspect: x% units are wider on screen than y% units
  function dist(a,b){var dx=(a.x-b.x)*AS,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
  var blobs=[];
  names.forEach(function(r){
    var pts=groups[r].slice();
    var others=[];
    names.forEach(function(o){if(o!==r)others=others.concat(groups[o]);});
    function padAt(p){
      var base=4.2,dmin=1e9;
      for(var i=0;i<others.length;i++){var d=dist(p,others[i]);if(d<dmin)dmin=d;}
      return Math.max(1.4,Math.min(base,dmin*0.45));
    }
    var cx=0,cy=0;pts.forEach(function(p){cx+=p.x;cy+=p.y;});cx/=pts.length;cy/=pts.length;
    if(pts.length===1){
      var p=pts[0];blobs.push({r:r,circle:[p.x,p.y,padAt(p)]});return;
    }
    if(pts.length===2){
      var dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,L=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/L*1.6,ny=dx/L*1.6;
      pts=pts.concat([{x:cx+nx,y:cy+ny},{x:cx-nx,y:cy-ny}]);
    }
    var hull=smapHull(pts);
    var out=hull.map(function(p){
      var dx=p.x-cx,dy=p.y-cy,L=Math.sqrt(dx*dx+dy*dy)||1;
      var pad=padAt(p);
      return {x:p.x+dx/L*pad/AS,y:p.y+dy/L*pad};
    });
    if(out.length<3){blobs.push({r:r,circle:[cx,cy,padAt({x:cx,y:cy})]});return;}
    blobs.push({r:r,path:smapSmoothClosed(out)});
  });
  return blobs;
}
function smapInfluenceInner(){
  if(smapInfHidden)return '';
  var s='';
  smapInfluenceBlobs().forEach(function(b){
    var col=smapRegionColor(b.r);
    if(b.circle)s+='<ellipse cx="'+b.circle[0].toFixed(2)+'" cy="'+b.circle[1].toFixed(2)+'" rx="'+(b.circle[2]/1.493).toFixed(2)+'" ry="'+b.circle[2].toFixed(2)+'" fill="'+col+'" fill-opacity="0.10" stroke="'+col+'" stroke-opacity="0.35" stroke-width="0.18" filter="url(#smapInfBlur)"><title>'+esc(b.r)+'</title></ellipse>';
    else if(b.path)s+='<path d="'+b.path+'" fill="'+col+'" fill-opacity="0.10" stroke="'+col+'" stroke-opacity="0.35" stroke-width="0.18" filter="url(#smapInfBlur)"><title>'+esc(b.r)+'</title></path>';
  });
  return s;
}
function smapInfluenceSVG(){
  return '<svg id="smap-inf-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><filter id="smapInfBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.7"/></filter></defs><g id="smap-inf-g">'+smapInfluenceInner()+'</g></svg>';

(function(){

  function fail(err){
    BOOT.querySelector('.boot-in').innerHTML='<div class="boot-logo">56TH <span>CENTURY</span></div>'
    +'<div class="boot-err"><div class="boot-err-t">Could not load game data</div>'
    +'<p>The compendium reads its data from <code>data/v8/</code> and must be served over <b>HTTP</b> — opening the file by double-clicking won’t work.</p>'
    +'<p>Local test: run <code>python -m http.server</code> in this folder, then open <code>http://localhost:8000/</code></p>'
    +'<p class="boot-err-d">'+String(err&&err.message||err)+'</p>'
    +'<button onclick="location.reload()">Retry</button></div>';
    if(window.console)console.error(err);
  }
  var base='data/v8/',CB='?_cb='+Date.now();
  fetch(base+'manifest.json'+CB).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status+' for manifest.json');return r.json();})
  .then(function(man){
    var files=man.files,done=0,data={};
    MSG.textContent='Loading '+files.length+' data files…';
    return Promise.all(files.map(function(fn){
      return fetch(base+fn+CB).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status+' for '+fn);return r.json();})
      .then(function(d){for(var k in d)data[k]=d[k];done++;FILL.style.width=Math.round(done/files.length*100)+'%';MSG.textContent=fn+' ✓ ('+done+'/'+files.length+')';});
    })).then(function(){return data;});
  })
  .then(function(data){
    window.__DATA=data;
    MSG.textContent='Rendering…';
    var s=document.createElement('script');
    s.textContent=document.getElementById('main-src').textContent;
    document.body.appendChild(s);
    requestAnimationFrame(function(){BOOT.classList.add('done');setTimeout(function(){if(BOOT.parentNode)BOOT.parentNode.removeChild(BOOT);},500);});
  })
  .catch(fail);
})();
