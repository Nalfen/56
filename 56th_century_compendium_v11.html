const SCOMP_TIERS=['BASIC','AVERAGE','GOOD'];
// Build flat component entry array from compact SCOMP_DEF
function buildShipComps(){
  const RARITY_MULT={COMMON:1,UNCOMMON:1.5,RARE:3,LIMITED:8,UNIQUE:20};
  const out=[];
  Object.entries(SCOMP_DEF).forEach(([type,def])=>{
    SCOMP_CLASSES.forEach((cls,si)=>{
      if(def.classes!=='ALL'&&!def.classes.includes(cls)) return;
      SCOMP_TIERS.forEach((qual,ti)=>{
        const u=def.unit[si]||0, pw=def.pwr[si]||0, pr=def.price[si]||0;
        if(!u&&!pr) return; // skip zero-cost/zero-size entries (class not applicable)
        const tierDef=def.tiers[ti]||{};
        const rarity=tierDef.rarity||'COMMON';
        const rmult=RARITY_MULT[rarity]||1;
        const stats={};
        Object.entries(tierDef).forEach(([k,v])=>{if(k!=='rarity')stats[k]=v;});
        out.push({id:`${type}_${si+1}-${cls}_${ti+1}-${qual}`,type,name:def.name,ship_class:cls,quality:qual,unit_size:u,pwr_draw:pw,price:Math.round(pr*rmult),rarity,note:def.note||null,stats});
      });
    });
  });
  return out;
}
if(!g.catalog) g.catalog={};
g.catalog.ship_components=buildShipComps();

// Ammo option compatibility matrix: 1=compatible, 0=incompatible
// Order: DP, S, HE, LB, AR, STN, FIRE, EMP, CRIT, SB
const AMMO_OPT_CODES=['DP','S','HE','LB','AR','STN','FIRE','EMP','CRIT','SB'];
const AMMO_COMPAT=(()=>{
  const C={DP:{S:1,HE:0,LB:0,AR:1,STN:1,FIRE:1,EMP:1,CRIT:1,SB:1},S:{DP:1,HE:1,LB:1,AR:1,STN:1,FIRE:1,EMP:1,CRIT:1,SB:1},HE:{DP:0,S:1,LB:0,AR:0,STN:1,FIRE:0,EMP:0,CRIT:1,SB:0},LB:{DP:0,S:1,HE:0,AR:0,STN:1,FIRE:1,EMP:1,CRIT:1,SB:0},AR:{DP:1,S:1,HE:0,LB:0,STN:1,FIRE:1,EMP:0,CRIT:1,SB:1},STN:{DP:1,S:1,HE:1,LB:1,AR:1,FIRE:1,EMP:1,CRIT:1,SB:1},FIRE:{DP:1,S:1,HE:0,LB:1,AR:1,STN:1,EMP:1,CRIT:1,SB:1},EMP:{DP:1,S:1,HE:0,LB:1,AR:0,STN:1,FIRE:1,CRIT:1,SB:1},CRIT:{DP:1,S:1,HE:1,LB:1,AR:1,STN:1,FIRE:1,EMP:1,SB:1},SB:{DP:1,S:1,HE:0,LB:0,AR:1,STN:1,FIRE:1,EMP:1,CRIT:1}};
  return C;
})();

function parseSk(s){if(!s||s==='0')return{d:0,f:0};const m=String(s).match(/^(\d*)D([+-]\d+)?$/i);if(m)return{d:parseInt(m[1]||1),f:parseInt(m[2]||0)};return{d:0,f:parseInt(s)||0};}
function fmtSk(d,f){if(!d&&!f)return'0';if(!d)return String(f);if(!f)return d+'D';return d+'D'+(f>0?'+':'')+f;}

function calcDrone(){
  if(!dbState.size||!dbState.mob) return null;
  const sz=DB_SIZES[dbState.size];
  const mob=DB_MOB[dbState.mob];
  const defRk=DB_DEF_RANKS;
  const maxDef=(a,b)=>defRk[Math.max(defRk.indexOf(a||'NONE'),defRk.indexOf(b||'NONE'))];
  const sk0=parseSk(sz.soak);
  const r={
    dur:sz.dur, sys:sz.sys, soak_d:sk0.d, soak_f:sk0.f,
    phys:'NONE', energy:'NONE', tech:'NONE', spirit:'NONE',
    prim_spd:mob.base_spd+sz.spd_mod, prim_mode:mob.base_mode,
    alt_mode:mob.alt_mode, alt_spd:mob.alt_spd,
    extra_modes:[],
    pwr_avail:0, pwr_used:0,
    slots_used:0, slots_max:sz.slots,
    awareness:0, sensor_range:null,
    comms:null, ecm:0, ammo_cap:0,
    skills:[], mounts:[], arms:null,
    autonomy_sources:[],
    dc:Math.max(sz.dc, mob.dc),
    cost:sz.price+mob.price,
    legality:'LEGAL',
    warns:[],
  };
  const LEG_ORDER=['LEGAL','PERMIT REQUIRED','RESTRICTED','ILLEGAL','CLASSIFIED'];
  const all=[
    ...dbState.core.map(c=>({...c,loc:'core'})),
    ...dbState.internal.map(c=>({...c,loc:'int'})),
    ...dbState.external.map(c=>({...c,loc:'ext'})),
  ];
  let spd_pen=0;
  for(const comp of all){
    const def=DB_COMP[comp.type];
    if(!def) continue;
    const t=def.tiers[comp.tier];
    if(!t) continue;
    const zkey=comp.loc==='int'?'internal':comp.loc==='ext'?'external':comp.loc;
    const zone=DB_ZONE[zkey]||{dc_mod:0,cost_mod:1};
    r.cost+=Math.round((t.price||0)*zone.cost_mod);
    r.dc=Math.max(r.dc,(t.dc||0)+zone.dc_mod);
    if(t.legality){const li=LEG_ORDER.indexOf(t.legality);const ci=LEG_ORDER.indexOf(r.legality);if(li>ci)r.legality=t.legality;}
    r.slots_used+=t.slots||0;
    r.pwr_used+=t.pwr||0;
    r.pwr_avail+=t.pwr_give||0;
    if(t.dur_bonus) r.dur+=t.dur_bonus;
    if(t.sys_bonus) r.sys+=t.sys_bonus;
    r.phys=maxDef(r.phys,t.phys);
    r.energy=maxDef(r.energy,t.energy);
    r.tech=maxDef(r.tech,t.tech);
    r.spirit=maxDef(r.spirit,t.spirit);
    if(t.soak_bonus){const sb=parseSk(String(t.soak_bonus));r.soak_d+=sb.d;r.soak_f+=sb.f;}
    if(t.spd_mod) spd_pen+=t.spd_mod;
    if(t.awareness!=null&&t.awareness>r.awareness){r.awareness=t.awareness;r.sensor_range=t.range;}
    if(t.comm_range) r.comms=t.comm_range;
    if(t.ecm) r.ecm+=t.ecm;
    if(t.ammo_cap) r.ammo_cap+=t.ammo_cap;
    if(comp.type==='SKILL_MODULE'&&comp.skills) r.skills.push(...comp.skills.map(s=>s+' '+t.rank));
    if(comp.type==='WEAPON_MOUNT'){
      r.mounts.push({name:t.name,weapon_type:t.weapon_type,weapon_size:t.weapon_size,needs_ammo:t.needs_ammo,auto_aim:t.auto_aim,weapon:comp.weapon||null,zone:comp.loc});
    }
    if((comp.type==='ARM_GRIPPER'||comp.type==='ARM_PRECISION'||comp.type==='ARM_HEAVY')&&(!r.arms||t.str>r.arms.str)){
      r.arms={n:t.arms,str:t.str,fine:t.fine_motor};
    }
    if(t.mode) r.extra_modes.push(t.mode+' '+t.speed+'m/r'+(t.note?' ('+t.note+')':''));
    if(t.autonomy) r.autonomy_sources.push({name:t.name,auto:t.autonomy});
  }
  const SPD_MULT={STATIC:0,WALKER:1.0,CLIMBER:1.0,SWIM:0.8,HOVER:1.5,FLY:2.0};
  const spd_mult=SPD_MULT[dbState.mob]||1.0;
  const spd_neg=Math.min(0,spd_pen), spd_pos=Math.max(0,spd_pen);
  if(mob.base_mode) r.prim_spd=Math.max(0,r.prim_spd+Math.round(spd_neg*spd_mult)+spd_pos);
  if(dbState.mob==='STATIC') r.prim_spd=0;
  if(dbState.atmo&&dbState.mob==='FLY'){r.dc++;r.cost+=15000;}
  r.soak=fmtSk(r.soak_d,r.soak_f);
  const hasPower=all.some(c=>c.type==='POWER_CELL'||c.type==='FUSION_CORE'||c.type==='CORONTHIA_REACTOR');
  if(!hasPower) r.warns.push('No power source, drone cannot function');
  const hasCoronthia=all.some(c=>c.type==='CORONTHIA_REACTOR');
  const hasFuelCell=all.some(c=>c.type==='FUEL_CELL');
  if(hasCoronthia&&!hasFuelCell) r.warns.push('Coronthia Reactor requires a Fuel Cell component');
  if(r.pwr_used>r.pwr_avail) r.warns.push('Power deficit: '+(r.pwr_used-r.pwr_avail)+' over capacity');
  if(r.slots_used>r.slots_max) r.warns.push('Slot overload: '+r.slots_used+'/'+r.slots_max+' slots used');
  const kMounts=r.mounts.filter(m=>m.needs_ammo);
  if(kMounts.length&&!r.ammo_cap) r.warns.push('Kinetic weapon mounts require Ammo Storage');
  if(sz){const mc=sz.max_comp;for(const comp of all){const def=DB_COMP[comp.type];if(!def)continue;const t=def.tiers[comp.tier];if(t&&(t.slots||0)>mc)r.warns.push(def.name+' ('+t.name+') exceeds max component size for '+sz.name+' chassis (max '+mc+' slots)');}}
  return r;
}

function dbTierDesc(type,t){
  const p=[];
  if(t.pwr_give) p.push('⚡ +'+t.pwr_give+' pwr generated');
  if(t.autonomy) p.push('⏱ '+t.autonomy);
  if(t.pwr) p.push('⚡ '+t.pwr+' pwr draw');
  p.push('📦 '+t.slots+' slot'+(t.slots>1?'s':''));
  p.push('💰 '+fmt(t.price)+' Cr');
  p.push('DC '+(t.dc||0));
  if(t.dur) p.push('🩹 Dur '+t.dur);
  const defs=[];
  if(t.phys&&t.phys!=='NONE') defs.push('PHYS:'+t.phys);
  if(t.energy&&t.energy!=='NONE') defs.push('NRGY:'+t.energy);
  if(t.tech&&t.tech!=='NONE') defs.push('TECH:'+t.tech);
  if(t.spirit&&t.spirit!=='NONE') defs.push('SPRT:'+t.spirit);
  if(defs.length) p.push('🛡 '+defs.join(' '));
  if(t.soak_bonus) p.push('Soak +'+t.soak_bonus);
  if(t.dur_bonus) p.push('Durability '+(t.dur_bonus>0?'+':'')+t.dur_bonus);
  if(t.spd_mod) p.push('Speed '+t.spd_mod+'m/r');
  if(t.awareness) p.push('👁 Awareness +'+t.awareness+' Range '+t.range);
  if(t.weapon_type) p.push('🔫 '+t.weapon_type+' '+t.weapon_size+(t.needs_ammo?' (needs ammo)':'')+(t.auto_aim?' auto-aim':''));
  if(t.ammo_cap) p.push('Ammo x'+t.ammo_cap);
  if(t.arms) p.push('🦾 '+t.arms+' arm'+(t.arms>1?'s':'')+' STR '+t.str+(t.fine_motor?' (fine motor)':''));
  if(t.comm_range) p.push('📻 '+t.comm_range+(t.ecm?' ECM +'+t.ecm:''));
  if(t.ecm&&!t.comm_range) p.push('📡 ECM +'+t.ecm);
  if(t.skills_n) p.push('🧠 '+t.skills_n+' skill'+(t.skills_n>1?'s':'')+' rank '+t.rank+' Sys +'+t.sys_bonus);
  if(t.mode) p.push(t.mode+' '+t.speed+'m/r');
  if(t.rarity) p.push(t.rarity);
  if(t.legality) p.push(t.legality);
  if(t.note&&!t.mode) p.push(t.note);
  if(t.size_limit) p.push('⚠ '+t.size_limit.join('/')+' only');
  return p.join('  ·  ');
}

    } else if(comp.type==='WEAPON_MOUNT'&&comp.weapon){
      h+='<span class="db-comp-meta" style="color:var(--a2);" title="'+esc(comp.weapon)+'">'+esc(comp.weapon.length>12?comp.weapon.substring(0,12)+'..':comp.weapon)+'</span>';

      h+='<span class="db-comp-meta">'+t.slots+'U '+t.pwr+'P</span>';

    if(comp.type==='WEAPON_MOUNT'){

  const wpns=(g.weapons||[]).filter(w=>{

function renderDbAddPanel(loc){

    if(!d.loc.includes(loc)||isExclusive(k)) return false;
    if(szDat&&d.tiers.every(t=>(t.slots||0)>szDat.max_comp)) return false;
    return true;
  });
  let h='<div class="db-add-panel">';

      h+='<button class="db-chip'+(dbAdd.tier===i?' sel':'')+'" data-db="atier:'+i+'">'+esc(t.name)+'</button>';
    });
    h+='</div>';
    const t=def.tiers[dbAdd.tier];
    h+='<div class="db-tier-desc">'+dbTierDesc(dbAdd.type,t)+'</div>';

    }

    h+='<div class="db-add-row-btns">';

  h+='</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px;">';
  ['phys','energy','tech','spirit'].forEach(k=>{
    const v=st[k]||'NONE';
    const lbl={phys:'PHYS',energy:'ENERGY',tech:'TECH',spirit:'SPIRIT'}[k];
    h+='<div class="db-stat-box"><div class="db-stat-lbl">'+lbl+'</div><div class="db-stat-val" style="color:'+(defCol[v]||'var(--mu)')+';font-size:10.5px;">'+v+'</div></div>';
  });

  h+='<div class="db-pwr-bar"><div class="db-pwr-fill" style="width:'+pct+'%;background:'+pwrColor+';"></div></div>';
  h+='</div>';
  const slotPct=st.slots_max?st.slots_used/st.slots_max:0;
  const slotCol=slotPct>1?'var(--re)':slotPct>0.8?'var(--a2)':'var(--mu)';

  if(st.autonomy_sources.length){h+='<div class="db-info" style="color:#34d399;">⏱ '+st.autonomy_sources.map(s=>esc(s.name)+': '+esc(s.auto)).join(' · ')+'</div>';}

  if(st.comms){h+='<div class="db-info">📻 Comms: '+esc(st.comms)+(st.ecm?' · ECM +'+st.ecm:'')+'</div>';}
  else if(st.ecm){h+='<div class="db-info">📡 ECM +'+st.ecm+'</div>';}
  if(st.arms){h+='<div class="db-info">🦾 '+st.arms.n+' arm'+(st.arms.n>1?'s':'')+' STR '+st.arms.str+(st.arms.fine?' (fine motor)':'')+'</div>';}
  if(st.ammo_cap){h+='<div class="db-info">📦 Ammo storage: x'+st.ammo_cap+'</div>';}
  if(st.mounts.length){
    h+='<hr class="db-divider">';
    h+='<div style="font-size:10px;color:var(--a);font-family:Orbitron,sans-serif;letter-spacing:.06em;margin-bottom:4px;">🔫 ARMAMENT</div>';
    st.mounts.forEach(m=>{
      h+='<div class="db-info">';
      h+='<span style="color:var(--mu);">'+esc(m.name)+'</span>';
      h+=' <span class="tag '+(m.weapon_type==='ENERGY'?'tp':'to')+'" style="font-size:8px;">'+m.weapon_type+(m.needs_ammo?' +AMMO':'')+'</span>';

      if(m.weapon) h+=' → <span style="color:var(--a2);">'+esc(m.weapon)+'</span>';
      else h+=' <span style="color:var(--mu);font-style:italic;">no weapon selected</span>';
      h+='</div>';
      if(m.weapon){
        const wd=(g.weapons||[]).find(w=>w.name===m.weapon);
        if(wd){
          h+='<div style="margin:2px 0 6px 12px;padding:5px 8px;background:rgba(0,0,0,.3);border-left:2px solid '+(m.weapon_type==='ENERGY'?'#a855f7':'#ff6b35')+';border-radius:0 4px 4px 0;font-family:ShareTechMono,monospace;font-size:10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;">';
          if(wd.damage) h+='<span style="color:#fb923c;font-weight:bold;">'+esc(wd.damage)+'</span>';
          if(wd.range_short) h+='<span style="color:var(--mu);">Rng '+esc(wd.range_short)+'/'+esc(wd.range_med)+'/'+esc(wd.range_long)+'m</span>';
          if(wd.ammo) h+='<span style="color:var(--mu);">Ammo:'+esc(wd.ammo)+'</span>';
          if(wd.rof&&wd.rof.trim()) h+='<span style="color:var(--mu);">RoF:'+esc(wd.rof)+'</span>';
          if(wd.special&&wd.special.trim()) h+='<span style="color:#60a5fa;">'+esc(wd.special)+'</span>';
          if(wd.legality) h+='<span style="color:var(--ye);">'+esc(wd.legality)+'</span>';
          h+='</div>';
        }
      }
    });
  }
  if(st.warns.length){
    h+='<hr class="db-divider">';
    st.warns.forEach(w=>{h+='<div class="db-warn">⚠ '+esc(w)+'</div>';});
  } else {
    h+='<hr class="db-divider">';
    h+='<div class="db-ok">✓ Build valid</div>';
  }
  const dbLegCol={'LEGAL':'#4ade80','PERMIT REQUIRED':'#86efac','RESTRICTED':'#facc15','ILLEGAL':'#fb923c','CLASSIFIED':'#f87171'};
  h+='<div class="db-footer">';

  h+='<span class="db-dc-badge">Fabrication DC '+st.dc+'</span>';
  h+='<span class="db-dc-badge" style="color:'+(dbLegCol[st.legality]||'#fff')+';">'+st.legality+'</span>';
  h+='</div>';
  h+='</div>';
  return h;
}

// Build drone_parts catalog (all component tiers as flat entries)
function buildDroneParts(){
  const out=[];
  Object.entries(DB_COMP).forEach(([type,def])=>{
    def.tiers.forEach((t,ti)=>{
      out.push({id:type+'_'+ti,type,cat_name:def.name,icon:def.icon,tier_name:t.name,loc:def.loc,exclusive:!!def.exclusive,...t});
    });
  });
  return out;
}
g.catalog.drone_parts=buildDroneParts();

// ─── Planet Image Generator ───────────────────────────────────────────────────
// Generates 20 canvas-based planet images as data URIs (index 1–20; 0 = none)
var PLANET_IMGS=(function(){
  function adjHex(hex,amt){
    var r=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.min(255,Math.max(0,Math.round(r+255*amt)));
    g2=Math.min(255,Math.max(0,Math.round(g2+255*amt)));
    b=Math.min(255,Math.max(0,Math.round(b+255*amt)));
    return '#'+r.toString(16).padStart(2,'0')+g2.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
  }
  function h2rgba(hex,a){
    var r=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g2+','+b+','+a+')';
  }
  var cfgs=[
    {base:'#1a4a8c',bands:['#2060b0','#0f3070','#3080c0','#1555a0'],atmo:'#4080ff'},  // 1 deep ocean

    {base:'#5a2080',bands:['#7030a0','#4a1870','#8040b0','#3a1060'],atmo:'#a060e0'}, // 4 purple gas
    {base:'#b07040',bands:['#c08050','#906030','#d09060','#804020'],atmo:'#f0a060'}, // 5 jupiter tan
    {base:'#a0d0e8',bands:['#c0e8f8','#88bcd8','#d0f0ff','#70a8c8'],atmo:'#e0f8ff'}, // 6 ice world
    {base:'#c09050',bands:['#d0a860','#b08040','#e0b870','#a07030'],atmo:'#f0c880'}, // 7 desert
    {base:'#1a0808',bands:['#2a1010','#300808','#401010','#0a0404'],atmo:'#ff2010'}, // 8 dark volcanic
    {base:'#106060',bands:['#208080','#0a5050','#30a0a0','#0a4040'],atmo:'#20e0d0'}, // 9 teal
    {base:'#802000',bands:['#c03000','#601000','#ff4000','#a02800'],atmo:'#ff6000'}, // 10 lava
    {base:'#1a5c20',bands:['#2a7c30','#0a4010','#3a9040','#154a18'],atmo:'#80ff60'}, // 11 forest

    {base:'#606060',bands:['#787878','#505050','#888888','#484848'],atmo:'#c0c0c8'}, // 14 moon grey
    {base:'#0a1040',bands:['#101860','#080c38','#181c70','#060828'],atmo:'#2040c0'}, // 15 deep space
    {base:'#b08000',bands:['#d0a010','#906800','#f0c020','#806000'],atmo:'#ffd040'}, // 16 amber/gold
    {base:'#108870',bands:['#20a880','#0a6858','#30c898','#087060'],atmo:'#30f0c0'}, // 17 turquoise
    {base:'#601010',bands:['#801818','#500808','#901c1c','#400808'],atmo:'#e02020'}, // 18 blood red
    {base:'#308810',bands:['#40a818','#206808','#50c820','#186008'],atmo:'#80ff20'}, // 19 alien green
    {base:'#6858a0',bands:['#8070c0','#504888','#9080d0','#483870'],atmo:'#c0a8ff'}, // 20 lavender
    {base:'#1c2840',bands:['#243050','#141c2e','#2c3858','#101828'],atmo:'#5878c8'}, // 21 dark storm
    {base:'#050f18',bands:['#081420','#020c10','#0a1828','#040c14'],atmo:'#00e8c0'}, // 22 bioluminescent

    {base:'#c8dff0',bands:['#d8f0ff','#b0ccdc','#e8f8ff','#a0c0d8'],atmo:'#f0f8ff'}, // 25 crystal ice
  ];
  var imgs=[null];
  cfgs.forEach(function(cfg){
    var cv=document.createElement('canvas');cv.width=64;cv.height=64;
    var ctx=cv.getContext('2d');
    var cx=32,cy=32,r=28;
    ctx.save();
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    // Base radial gradient (light from top-left)
    var bg=ctx.createRadialGradient(cx-10,cy-10,2,cx,cy,r);

      var y0=cy-r+(bi/cfg.bands.length)*r*2;

  (function(){

    for(var gy=-r;gy<=r;gy+=7){ctx.beginPath();ctx.moveTo(0,cy+gy);ctx.lineTo(64,cy+gy);ctx.stroke();}
    ctx.fillStyle='rgba(0,200,255,0.55)';

  if(smapPinPos)return smapPinPos;
  var def={};
  Object.keys(GALAXY_MAP_POS).forEach(function(k){
    if(k==='_viewport')return;
    var e=GALAXY_MAP_POS[k];
    def[k]={x:e.x,y:e.y};
    if(e.color)def[k].color=e.color;
    if(e.shape)def[k].shape=e.shape;
    if(e.planet_img)def[k].planet_img=e.planet_img;
    if(e.planet_scale)def[k].planet_scale=e.planet_scale;
    if(e.label_hidden)def[k].label_hidden=true;
    if(e.label_size)def[k].label_size=e.label_size;
    if(e.label_pos)def[k].label_pos=e.label_pos;
  });
  try{var s=localStorage.getItem('smap_pin_pos');if(s){var p=JSON.parse(s);Object.keys(p).forEach(function(k){def[k]=p[k];});}}catch(e){}
  smapPinPos=def;return def;
}
function smapPosSave(){try{localStorage.setItem('smap_pin_pos',JSON.stringify(smapPinPos));}catch(e){}}

}

function openWorldPanel(systemKey){
  const system=worldData[systemKey];
  if(!system)return;
  document.getElementById('world-panel-title').textContent=system.name;
  document.getElementById('world-panel-sub').textContent=system.sub||'';
  const body=document.getElementById('world-panel-body');
  body.innerHTML=system.worlds.map(function(w){
    return '<div class="world-entry" onclick="toggleWorldEntry(this)">'+
      '<div class="world-entry-header">'+
        '<div>'+
          '<div class="world-entry-name">'+esc(w.name)+'</div>'+
          '<div class="world-entry-sub">'+esc(w.type||'')+'</div>'+
        '</div>'+
        '<span class="world-entry-status ws-'+esc(w.status)+'">'+esc(w.statusLabel)+'</span>'+
      '</div>'+
      '<div class="world-entry-body">'+
        '<div class="world-entry-desc">'+w.desc+'</div>'+
        '<div class="world-entry-stats">'+
          '<div class="world-entry-stat"><div class="world-entry-stat-label">Controlling Faction</div><div class="world-entry-stat-value">'+esc(w.faction)+'</div></div>'+
          '<div class="world-entry-stat"><div class="world-entry-stat-label">Population</div><div class="world-entry-stat-value">'+esc(w.population)+'</div></div>'+
          '<div class="world-entry-stat"><div class="world-entry-stat-label">Status</div><div class="world-entry-stat-value">'+esc(w.statusLabel)+'</div></div>'+
          '<div class="world-entry-stat"><div class="world-entry-stat-label">Notable For</div><div class="world-entry-stat-value">'+esc(w.notable)+'</div></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  document.getElementById('world-panel').classList.add('open');
  document.getElementById('world-panel-overlay').classList.add('open');
}
function closeWorldPanel(){
  document.getElementById('world-panel').classList.remove('open');
  document.getElementById('world-panel-overlay').classList.remove('open');
}
function toggleWorldEntry(el){
  var wasOpen=el.classList.contains('open');
  el.closest('.world-panel-body').querySelectorAll('.world-entry').forEach(function(e){e.classList.remove('open');});
  if(!wasOpen)el.classList.add('open');
}

// ─── Star Map Viewer ──────────────────────────────────────────────────────────
// Build a lightweight procedural SVG galaxy (no external image required)
function buildGalaxySVG(){
  // Deterministic pseudo-random star field
  var sd=1337;
  function rng(){sd=(sd*1664525+1013904223)>>>0;return sd/4294967295;}
  var W=2000,H=2000;
  var stars='';
  // Regular stars
  for(var i=0;i<700;i++){
    var sx=(rng()*W).toFixed(1),sy=(rng()*H).toFixed(1);
    var sr=(rng()*1.3+0.2).toFixed(2),sop=(rng()*0.6+0.2).toFixed(2);
    var sbr=rng();
    var scol=sbr>0.97?'#c8e8ff':sbr>0.88?'#e0f2ff':'#ffffff';
    stars+='<circle cx="'+sx+'" cy="'+sy+'" r="'+sr+'" fill="'+scol+'" opacity="'+sop+'"/>';
  }
  // Bright/large stars
  for(var j=0;j<28;j++){
    var bx=(rng()*W).toFixed(1),by=(rng()*H).toFixed(1);
    var br2=(rng()*2.2+1.5).toFixed(2),bop=(rng()*0.45+0.55).toFixed(2);
    stars+='<circle cx="'+bx+'" cy="'+by+'" r="'+br2+'" fill="#ffffff" opacity="'+bop+'"/>';
  }
  // Cross-flare on a few very bright stars
  for(var k=0;k<6;k++){
    var fx=(rng()*W).toFixed(1),fy=(rng()*H).toFixed(1);
    stars+='<line x1="'+(parseFloat(fx)-6)+'" y1="'+fy+'" x2="'+(parseFloat(fx)+6)+'" y2="'+fy+'" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>';
    stars+='<line x1="'+fx+'" y1="'+(parseFloat(fy)-6)+'" x2="'+fx+'" y2="'+(parseFloat(fy)+6)+'" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>';
    stars+='<circle cx="'+fx+'" cy="'+fy+'" r="2.5" fill="#ffffff" opacity="0.9"/>';
  }
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;pointer-events:none;display:block;">'
    +'<defs>'
    +'<filter id="sm-tf"><feGaussianBlur stdDeviation="80"/></filter>'
    +'<filter id="sm-tf2"><feGaussianBlur stdDeviation="42"/></filter>'
    +'<filter id="sm-rift"><feGaussianBlur stdDeviation="55"/></filter>'
    +'<filter id="sm-sg"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    +'<radialGradient id="sm-cg" cx="48%" cy="52%" r="55%">'
    +'<stop offset="0%" stop-color="#1a3a6a" stop-opacity="0.35"/>'
    +'<stop offset="55%" stop-color="#0a1535" stop-opacity="0.12"/>'
    +'<stop offset="100%" stop-color="#000000" stop-opacity="0"/>'
    +'</radialGradient>'
    // Second core layer for spiral illusion
    +'<radialGradient id="sm-cg2" cx="50%" cy="50%" r="40%">'
    +'<stop offset="0%" stop-color="#4060cc" stop-opacity="0.15"/>'
    +'<stop offset="100%" stop-color="#000000" stop-opacity="0"/>'
    +'</radialGradient>'
    +'</defs>'
    // Background
    +'<rect width="'+W+'" height="'+H+'" fill="#06060d"/>'
    // Galaxy core glows
    +'<ellipse cx="1000" cy="1000" rx="850" ry="700" fill="url(#sm-cg)"/>'
    +'<ellipse cx="980" cy="1020" rx="420" ry="340" fill="url(#sm-cg2)"/>'
    // (hardcoded territory ellipses removed — data-driven influence layer instead)
    // (Nemani Rift band removed — looked like a smear over the data-driven map)
    // Stars layer (on top of territories)
    +'<g>'+stars+'</g>'
    +'</svg>';
}

};
function smapRegionColor(regionStr){
  if(!regionStr)return '#aeaeb2';
  for(var k in SMAP_REGION_COLORS){if(regionStr.toLowerCase().indexOf(k.toLowerCase())>=0)return SMAP_REGION_COLORS[k];}
  return '#aeaeb2';
}
function smapEntryColor(e){
  // Faction/region colors
  switch(e.name){
    case 'Alliance Space':return '#00c8ff';
    case 'Torc Federation':return '#30d158';
    case 'Mubothen Empire':return '#ff9f0a';
    case 'Zegitor Trade Guild':return '#64d2ff';
    case 'Freeland':return '#bf5af2';
    case 'The Dark Space':return '#8e8e93';
    case 'Nemani Rift':return '#ffd60a';
    case 'Kraven Space':return '#ff2d55';
    case 'The Endless Darkness':return '#6e40c9';
    case "Nuzonia's Dream":return '#ffd60a';
  }
  // System pins: color by region
  if(e.entry_type==='system'){
    var reg=(e.region||'').toLowerCase();
    if(/alliance space/i.test(reg))return '#00c8ff';
    if(/dark space/i.test(reg))return '#8e8e93';
    if(/mubothen/i.test(reg))return '#ff9f0a';
    if(/kraven/i.test(reg))return '#ff2d55';
    if(/freeland/i.test(reg))return '#bf5af2';
    if(/zegitor/i.test(reg))return '#64d2ff';
    if(/torc/i.test(reg))return '#30d158';
    if(/nuzonia/i.test(reg))return '#ffd60a';
    if(/endless darkness/i.test(reg))return '#6e40c9';
    if(/proxima/i.test(reg))return '#ff6961';
    return '#a0c8e0';
  }
  return e.worlds_key?'#00c8ff':'#aeaeb2';
}
function smapLabel(name){
  if(name==='B.I.G. (Beningen Ingratias Garlan)')return 'B.I.G.';
  return name.replace(/ System$/i,'');
}

function smapGetEntry(name){
  var e=(g.catalogue_systems||[]).find(function(s){return s.name===name;});
  if(!e)e=(g.galaxy||[]).find(function(s){return s.name===name;});
  return e||null;
}
function smapPinQuerySel(name){
  // Build a safe attribute selector for data-pin
  return '[data-pin="'+name.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"]';
}
function smapSetPinColor(name,color){
  var pos=smapPosLoad();
  if(!pos[name])return;
  if(color==='default')delete pos[name].color;
  else pos[name].color=color;
  smapPosSave();
  // Targeted DOM update — avoids full re-render which would reset hlbl classes
  var entry=smapGetEntry(name);
  var col=(color==='default')?(entry?smapEntryColor(entry):'#8e8e93'):color;
  var dot=document.querySelector(smapPinQuerySel(name));
  if(dot){
    var inner=dot.querySelector('.smap-dot-inner');
    if(inner){inner.style.background=col;inner.style.borderColor=col;inner.style.boxShadow='0 0 8px '+col+',0 0 16px '+col+'44';}
    var pimg=dot.querySelector('.smap-dot-planet');
    if(pimg){var ps=parseFloat(pimg.style.width)||32;pimg.style.filter='drop-shadow(0 0 '+Math.round(ps*0.15)+'px '+col+') drop-shadow(0 0 '+Math.round(ps*0.28)+'px '+col+'66)';}
    var lbl=dot.querySelector('.smap-dot-lbl');
    if(lbl)lbl.style.color=col;
  }
  smapRefreshPopup();
}
function smapSetPinShape(name,shape){
  var pos=smapPosLoad();
  if(!pos[name])return;
  if(shape==='default')delete pos[name].shape;
  else pos[name].shape=shape;
  smapPosSave();
  // Targeted DOM update
  var dot=document.querySelector(smapPinQuerySel(name));
  if(dot){
    if(shape==='default')dot.removeAttribute('data-shape');
    else dot.setAttribute('data-shape',shape);

}

function smapSetPinScale(name,scale){

  smapPosSave();
  // Update the planet image size on the map in-place (avoids full re-render during drag)
  var ps=s*32;

function smapSetPinLabelPos(name,lpos){

function computePinLblStyle(pinData,ps,isSys){
  var halfH=ps?ps/2:(isSys?7:5);
  var gap=5;
  var fsMap={xs:'7px',s:'9px',m:'12px',l:'16px'};
  var fsStr=(pinData.label_size&&fsMap[pinData.label_size])?'font-size:'+fsMap[pinData.label_size]+';':'';
  var lpos=pinData.label_pos||'below';
  switch(lpos){
    case 'above':   return fsStr+'top:auto;bottom:'+(halfH+gap)+'px;left:0;right:auto;transform:translateX(-50%);text-align:center;';
    case 'left':    return fsStr+'top:0;bottom:auto;right:'+(halfH+gap)+'px;left:auto;transform:translateY(-50%);text-align:right;';
    case 'right':   return fsStr+'top:0;bottom:auto;left:'+(halfH+gap)+'px;right:auto;transform:translateY(-50%);text-align:left;';
    case 'above-left':  return fsStr+'top:auto;bottom:'+(halfH+gap)+'px;right:0;left:auto;transform:none;text-align:right;';
    case 'above-right': return fsStr+'top:auto;bottom:'+(halfH+gap)+'px;left:0;right:auto;transform:none;text-align:left;';
    case 'below-left':  return fsStr+'top:'+(halfH+gap)+'px;bottom:auto;right:0;left:auto;transform:none;text-align:right;';
    case 'below-right': return fsStr+'top:'+(halfH+gap)+'px;bottom:auto;left:0;right:auto;transform:none;text-align:left;';
    default:        return fsStr+'top:'+(halfH+gap)+'px;bottom:auto;left:0;right:auto;transform:translateX(-50%);text-align:center;';
  }
}
// ── Star Map Overlap Resolver ─────────────────────────────────────────────────
// After render, nudge pin+label bounding boxes apart by the minimum distance so
// nothing overlaps. Does NOT modify stored positions — purely visual CSS offsets.
function smapResolveOverlaps(){
  if(smapEditMode)return; // don't fight manual dragging
  var inner=document.getElementById('smap-inner');
  if(!inner)return;
  var baseRect=inner.getBoundingClientRect();
  if(!baseRect.width||!baseRect.height)return;
  var sc=(smapViewState&&smapViewState.scale)||1;
  var imgEl=document.getElementById('smap-img');
  var CW_=imgEl&&imgEl.naturalWidth?imgEl.naturalWidth:1323;
  var CH_=imgEl&&imgEl.naturalHeight?imgEl.naturalHeight:886;

  var dots=Array.from(inner.querySelectorAll('.smap-dot[data-pin]'));
  if(dots.length<2)return;

  // Build bounding box (screen px, relative to inner) + anchor centre for each pin
  var items=[];
  dots.forEach(function(dot){
    var els=[dot.querySelector('.smap-dot-inner'),dot.querySelector('.smap-dot-planet')].filter(Boolean);
    var lbl=dot.querySelector('.smap-dot-lbl');
    if(lbl&&!dot.classList.contains('hlbl')){
      var cs=window.getComputedStyle(lbl);
      if(cs.display!=='none'&&cs.visibility!=='hidden')els.push(lbl);
    }
    if(!els.length)return;
    var l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;
    els.forEach(function(el){
      var rx=el.getBoundingClientRect();
      l=Math.min(l,rx.left-baseRect.left);t=Math.min(t,rx.top-baseRect.top);
      r=Math.max(r,rx.right-baseRect.left);b=Math.max(b,rx.bottom-baseRect.top);
    });
    if(l>=r||t>=b)return;
    var dotEl=dot.querySelector('.smap-dot-inner')||dot.querySelector('.smap-dot-planet');
    var ax=0,ay=0;
    if(dotEl){var dr=dotEl.getBoundingClientRect();ax=(dr.left+dr.right)/2-baseRect.left;ay=(dr.top+dr.bottom)/2-baseRect.top;}
    items.push({dot:dot,l:l,t:t,r:r,b:b,ax:ax,ay:ay,ox:0,oy:0});
  });
  if(items.length<2)return;

  var GAP=3; // minimum pixel gap between bounding boxes
  var ITERS=120;
  for(var iter=0;iter<ITERS;iter++){
    var any=false;
    for(var i=0;i<items.length;i++){
      for(var j=i+1;j<items.length;j++){
        var a=items[i],bItem=items[j];
        var al=a.l+a.ox,ar=a.r+a.ox,at=a.t+a.oy,ab=a.b+a.oy;
        var bl=bItem.l+bItem.ox,br=bItem.r+bItem.ox,bt=bItem.t+bItem.oy,bb2=bItem.b+bItem.oy;
        var overX=Math.min(ar,br)-Math.max(al,bl)+GAP;
        var overY=Math.min(ab,bb2)-Math.max(at,bt)+GAP;
        if(overX>0&&overY>0){
          // Resolve along the axis requiring the least total movement
          if(overX<=overY){
            var halfX=overX/2;
            var sxSign=(a.ax+a.ox)<=(bItem.ax+bItem.ox)?-1:1;
            a.ox+=sxSign*halfX;bItem.ox-=sxSign*halfX;
          } else {
            var halfY=overY/2;
            var sySign=(a.ay+a.oy)<=(bItem.ay+bItem.oy)?-1:1;
            a.oy+=sySign*halfY;bItem.oy-=sySign*halfY;
          }
          any=true;
        }
      }
    }
    if(!any)break;
  }

  // Convert screen-pixel offsets back to image-% and apply to each dot element
  items.forEach(function(item){
    if(Math.abs(item.ox)<0.5&&Math.abs(item.oy)<0.5)return;
    var pctX=item.ox/sc/CW_*100;
    var pctY=item.oy/sc/CH_*100;
    var curL=parseFloat(item.dot.style.left)||0;
    var curT=parseFloat(item.dot.style.top)||0;
    item.dot.style.left=(curL+pctX).toFixed(3)+'%';
    item.dot.style.top=(curT+pctY).toFixed(3)+'%';
  });
}

function initStarmap(){
  var vp=document.getElementById('smap-viewport');
  var cv=document.getElementById('smap-canvas');
  var img=document.getElementById('smap-img');
  if(!vp||!cv)return;
  var CW=1323,CH=886;
  var scale=1,ox=0,oy=0,dragging=false,didDrag=false,startX=0,startY=0,sox=0,soy=0;
  var pinchDist=0;
  var pct=document.getElementById('smap-pct');
  var pinDrag=null; // {el,name,moved,startCX,startCY,startPX,startPY}

  function setInnerSize(){var inner=document.getElementById('smap-inner');if(inner){inner.style.width=CW+'px';inner.style.height=CH+'px';}}
  function applyT(){cv.style.transform='translate('+ox+'px,'+oy+'px) scale('+scale+')';if(pct)pct.textContent=Math.round(scale*100)+'%';smapViewState={scale:scale,ox:ox,oy:oy};}
  function fit(){
    if(img&&img.naturalWidth){CW=img.naturalWidth;CH=img.naturalHeight;setInnerSize();}
    var vw=vp.clientWidth,vh=vp.clientHeight;
    var s=Math.min(vw/CW,vh/CH)*0.92;
    scale=s;ox=(vw-CW*s)/2;oy=(vh-CH*s)/2;applyT();
  }
  function clamp(){
    var vw=vp.clientWidth,vh=vp.clientHeight;
    var iw=CW*scale,ih=CH*scale;
    var pad=Math.max(80,Math.min(vw,vh)*0.1);
    if(iw<=vw){ox=(vw-iw)/2;}else{ox=Math.min(pad,Math.max(ox,vw-iw-pad));}
    if(ih<=vh){oy=(vh-ih)/2;}else{oy=Math.min(pad,Math.max(oy,vh-ih-pad));}
  }
  function zoom(f,cx,cy){
    if(cx===undefined){cx=vp.clientWidth/2;cy=vp.clientHeight/2;}
    var ns=Math.max(0.25,Math.min(scale*f,8));
    ox=cx-(cx-ox)*(ns/scale);oy=cy-(cy-oy)*(ns/scale);scale=ns;clamp();applyT();
  }
  // Redraw gate SVG lines in-place after a pin drag (avoids full re-render)
  function refreshGates(){
    var svg=document.getElementById('smap-sg-svg');if(!svg)return;
    var pos=smapPosLoad();var gates=smapGatesLoad();var newH='';
    gates.forEach(function(pair){
      var a=pos[pair[0]],b=pos[pair[1]];if(!a||!b)return;
      newH+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#ffffff" stroke-width="0.25" stroke-dasharray="0.4,0.4" opacity="0.6" stroke-linecap="butt"/>';
    });
    svg.innerHTML=newH;smapRefreshInfluence();
  }

  // ── Wheel zoom ──
  vp.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,e.offsetX,e.offsetY);},{passive:false});

  // ── Mouse ──
  vp.addEventListener('mousedown',function(e){
    if(e.button!==0)return;
    // In edit mode try to start a pin drag
    if(smapEditMode&&!smapGateMode&&!smapPlacing){
      var pin=e.target.closest('[data-pin]');
      var inner=document.getElementById('smap-inner');
      if(pin&&inner&&inner.contains(pin)){
        var pos=smapPosLoad();var pn=pin.dataset.pin;var cur=pos[pn]||{x:50,y:50};
        pinDrag={el:pin,name:pn,moved:false,startCX:e.clientX,startCY:e.clientY,startPX:cur.x,startPY:cur.y};
        e.preventDefault();return;
      }
    }
    dragging=true;didDrag=false;startX=e.clientX;startY=e.clientY;sox=ox;soy=oy;
    vp.style.cursor='grabbing';e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(pinDrag){
      var dx=e.clientX-pinDrag.startCX,dy=e.clientY-pinDrag.startCY;
      if(Math.sqrt(dx*dx+dy*dy)>3)pinDrag.moved=true;
      if(pinDrag.moved){
        var nx=Math.max(0,Math.min(100,pinDrag.startPX+dx/(CW*scale)*100));
        var ny=Math.max(0,Math.min(100,pinDrag.startPY+dy/(CH*scale)*100));
        pinDrag.el.style.left=nx+'%';pinDrag.el.style.top=ny+'%';
      }
      return;
    }
    if(!dragging)return;
    var dx=e.clientX-startX,dy=e.clientY-startY;
    if(Math.sqrt(dx*dx+dy*dy)>4)didDrag=true;
    ox=sox+dx;oy=soy+dy;clamp();applyT();
  });
  document.addEventListener('mouseup',function(e){
    if(pinDrag){
      if(pinDrag.moved){
        var dx=e.clientX-pinDrag.startCX,dy=e.clientY-pinDrag.startCY;
        var pos=smapPosLoad();
        var nx=parseFloat(Math.max(0,Math.min(100,pinDrag.startPX+dx/(CW*scale)*100)).toFixed(2));
        var ny=parseFloat(Math.max(0,Math.min(100,pinDrag.startPY+dy/(CH*scale)*100)).toFixed(2));
        var cur=pos[pinDrag.name]||{};
        pos[pinDrag.name]=Object.assign({},cur,{x:nx,y:ny});
        smapPosSave();refreshGates();
      }
      pinDrag=null;return;
    }
    if(!dragging)return;
    dragging=false;vp.style.cursor='grab';
  });

  // ── Touch ──
  vp.addEventListener('touchstart',function(e){
    if(e.touches.length===1){dragging=true;didDrag=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;sox=ox;soy=oy;}
    else if(e.touches.length===2){dragging=false;pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
    e.preventDefault();
  },{passive:false});
  vp.addEventListener('touchmove',function(e){
    if(e.touches.length===1&&dragging){
      var dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      if(Math.sqrt(dx*dx+dy*dy)>4)didDrag=true;
      ox=sox+dx;oy=soy+dy;clamp();applyT();
    } else if(e.touches.length===2){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      var r=vp.getBoundingClientRect();
      zoom(d/pinchDist,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top);
      pinchDist=d;
    }
    e.preventDefault();
  },{passive:false});
  vp.addEventListener('touchend',function(){dragging=false;});

  // ── Click delegation ──
  vp.addEventListener('click',function(e){
    if(didDrag){didDrag=false;return;}
    if(pinDrag&&pinDrag.moved){pinDrag=null;return;}

    // Toolbar buttons (data-sm)
    var sm=e.target.closest('[data-sm]');
    if(sm){
      var a=sm.dataset.sm;
      if(a==='zin'){zoom(1.3);return;}
      if(a==='zout'){zoom(1/1.3);return;}
      if(a==='reset'){fit();return;}
      if(a==='edit-toggle'){
        smapEditMode=!smapEditMode;
        if(!smapEditMode){smapGateMode=false;smapGateFirst=null;smapPlacing=null;}
        render();return;
      }
      if(a==='gate-toggle'){smapGateMode=!smapGateMode;smapGateFirst=null;smapPlacing=null;render();return;}
      if(a==='pexp'){smapOpenExport();return;}
      if(a==='lbl'){toggleGlobalLabels();return;}
      if(a==='inf'){smapInfHidden=!smapInfHidden;try{localStorage.setItem('smap_inf_hide',smapInfHidden?'1':'0');}catch(e){}smapRefreshInfluence();sm.style.color=smapInfHidden?'#8e8e93':'var(--a2)';return;}
      if(a==='place-click'){
        var pn=sm.dataset.pin;
        smapPlacing=(smapPlacing===pn)?null:pn;
        smapGateMode=false;smapGateFirst=null;
        render();return;
      }
      if(a==='pin-remove'){
        var pn=sm.dataset.pin;
        var pos=smapPosLoad();delete pos[pn];smapPosSave();
        render();return;
      }
      if(a==='gate-del'){
        var pairStr=sm.dataset.gate;
        if(pairStr){
          var pp=pairStr.split('|||');
          smapGatesData=smapGatesLoad().filter(function(g){return !((g[0]===pp[0]&&g[1]===pp[1])||(g[0]===pp[1]&&g[1]===pp[0]));});
          smapGatesSave();refreshGates();render();
        }
        return;
      }
      return;
    }

    var pin=e.target.closest('[data-pin]');
    var inner=document.getElementById('smap-inner');
    var isMapPin=pin&&inner&&inner.contains(pin);

    // Gate mode: click two placed pins to create a gate
    if(smapEditMode&&smapGateMode&&isMapPin){
      var pinName=pin.dataset.pin;
      if(!smapGateFirst){smapGateFirst=pinName;render();}
      else if(smapGateFirst===pinName){smapGateFirst=null;render();}
      else {
        var gates=smapGatesLoad();
        var exists=gates.some(function(g){return (g[0]===smapGateFirst&&g[1]===pinName)||(g[0]===pinName&&g[1]===smapGateFirst);});
        if(!exists){gates.push([smapGateFirst,pinName]);smapGatesSave();}
        smapGateFirst=null;render();
      }
      return;
    }

    // Place mode: click the map to drop a pin
    if(smapEditMode&&smapPlacing&&!isMapPin){
      var innerEl=document.getElementById('smap-inner');
      if(innerEl){
        var ir=innerEl.getBoundingClientRect();
        var px=parseFloat(Math.max(0,Math.min(100,(e.clientX-ir.left)/ir.width*100)).toFixed(2));
        var py=parseFloat(Math.max(0,Math.min(100,(e.clientY-ir.top)/ir.height*100)).toFixed(2));
        var pos=smapPosLoad();
        pos[smapPlacing]={x:px,y:py,zoom:parseFloat(scale.toFixed(2))};
        smapPosSave();smapPlacing=null;render();
      }
      return;
    }

    // Normal click on a pin -> open system popup
    if(isMapPin&&!smapGateMode){
      var pinName=pin.dataset.pin;
      var entry=(g.catalogue_systems||[]).find(function(s){return s.name===pinName;});
      if(!entry)entry=(g.galaxy||[]).find(function(s){return s.name===pinName;});
      if(entry)openSmapPopup(entry,e.clientX,e.clientY);
      return;
    }

    // Close popup on background click — use composedPath so detached elements (after innerHTML rebuild) don't falsely trigger close
    var popup=document.getElementById('smap-popup');
    if(popup&&popup.style.display!=='none'){var path=e.composedPath?e.composedPath():[];if(!path.some(function(n){return n===popup;}))popup.style.display='none';}
  });

  setInnerSize();
  function restoreOrFit(){
    if(img&&img.naturalWidth){CW=img.naturalWidth;CH=img.naturalHeight;setInnerSize();}
    if(smapViewState){scale=smapViewState.scale;ox=smapViewState.ox;oy=smapViewState.oy;clamp();applyT();}
    else{fit();}
    // Defer overlap resolution until browser has completed layout
    requestAnimationFrame(function(){requestAnimationFrame(smapResolveOverlaps);});
  }
  if(img){img.addEventListener('load',restoreOrFit);if(img.complete&&img.naturalWidth)restoreOrFit();else restoreOrFit();}else{restoreOrFit();}
  if(window.__smapFocus){
    setTimeout(function(){
      var fn=window.__smapFocus;window.__smapFocus=null;if(!fn)return;
      var pp=smapPosLoad()[fn];
      if(pp){scale=Math.max(scale,2.2);ox=vp.clientWidth/2-(pp.x/100*CW)*scale;oy=vp.clientHeight/2-(pp.y/100*CH)*scale;clamp();applyT();}
      var entry=(g.catalogue_systems||[]).find(function(s){return s.name===fn;})||(g.galaxy||[]).find(function(s){return s.name===fn;});
      if(entry){var r=vp.getBoundingClientRect();openSmapPopup(entry,r.left+r.width/2,r.top+r.height/2);}
    },60);
  }
}

   lore fields (subtitle/quote/history/politics/culture/relations). Mirrors gcSysLore. */
function gcFacLore(f){
  if(!f)return'';
  var has=f.subtitle||f.quote||f.history||f.politics||f.culture||(f.relations&&f.relations.length);
  if(!has)return'';

  if(p.desc){

  }

  if(p.hazards&&p.hazards.length){
    h+='<div class="gc-psec"><div class="gc-psec-title">Hazards &amp; Dangers</div>';
    h+='<div class="gc-hazard-wrap">';
    (p.hazards||[]).forEach(function(hz){h+='<span class="gc-hazard">'+esc(hz)+'</span>';});
    h+='</div></div>';
  }
  // Notable locations
  if(p.notable_locations&&p.notable_locations.length){
    h+='<div class="gc-psec"><div class="gc-psec-title">Notable Locations</div>';
    h+='<div class="gc-loc-list">';
    (p.notable_locations||[]).forEach(function(loc){
      h+='<div class="gc-loc"><div class="gc-loc-name">'+esc(loc.name)+'</div><div class="gc-loc-desc">'+esc(loc.desc)+'</div></div>';
    });
    h+='</div></div>';

  h+=gcSpecialties(p);

    h+='<span class="gc-region-acc-arr">▼</span></div>';

    });

function gcSaveSystem(){
  var name=(document.getElementById('gcm-name')||{}).value;if(!name||!name.trim())return;name=name.trim();
  var sysData={
    name:name,
    region:(document.getElementById('gcm-region').value||'').trim(),
    classification:(document.getElementById('gcm-class').value||'').trim(),
    faction:(document.getElementById('gcm-faction').value||'').trim(),
    status:document.getElementById('gcm-status').value,
    tags:(document.getElementById('gcm-tags').value||'').split(',').map(function(t){return t.trim();}).filter(Boolean),
    desc:(document.getElementById('gcm-desc').value||'').trim()
  };
  if(gcModalMode==='add_system'){
    sysData.id=name.toLowerCase().replace(/[^a-z0-9]+/g,'_');
    sysData.planets=[];
    if(!g.catalogue_systems)g.catalogue_systems=[];
    g.catalogue_systems.push(sysData);
  } else {
    var orig=g.catalogue_systems[gcModalTargetSys];
    sysData.id=orig.id;sysData.planets=orig.planets||[];
    g.catalogue_systems[gcModalTargetSys]=sysData;
  }
  gcSaveToStorage();gcCloseModal();render();
  if(gcModalMode==='add_system')gcOpenSystems.add(sysData.id);
}

function gcSavePlanet(){
  var name=(document.getElementById('gcm-name').value||'').trim();if(!name)return;
  var hazards=[],locs=[],hooks=[];
  document.querySelectorAll('#gcm-hazards-list .gc-list-item input').forEach(function(inp){var v=(inp.value||'').trim();if(v)hazards.push(v);});
  document.querySelectorAll('#gcm-locs-list .gc-loc-edit').forEach(function(block){
    var nm=(block.querySelector('input').value||'').trim();
    var ds=(block.querySelector('textarea').value||'').trim();
    if(nm)locs.push({name:nm,desc:ds});
  });
  document.querySelectorAll('#gcm-hooks-list .gc-list-item textarea').forEach(function(ta){var v=(ta.value||'').trim();if(v)hooks.push(v);});
  var planet={
    id:name.toLowerCase().replace(/[^a-z0-9]+/g,'_'),
    name:name,
    type:(document.getElementById('gcm-type').value||'').trim(),
    status:document.getElementById('gcm-status').value,
    statusLabel:(document.getElementById('gcm-statuslabel').value||'').trim(),
    atmosphere:document.getElementById('gcm-atm').value,
    atm_note:(document.getElementById('gcm-atm-note').value||'').trim(),
    climate:(document.getElementById('gcm-climate').value||'').trim(),
    gravity:document.getElementById('gcm-grav').value,
    grav_note:(document.getElementById('gcm-grav-note').value||'').trim(),
    population:(document.getElementById('gcm-pop').value||'').trim(),
    demographics:(document.getElementById('gcm-demo').value||'').trim(),
    government:(document.getElementById('gcm-gov').value||'').trim(),
    faction:(document.getElementById('gcm-faction').value||'').trim(),
    tech_level:document.getElementById('gcm-tech').value,
    economy:(document.getElementById('gcm-economy').value||'').trim(),
    access:document.getElementById('gcm-access').value,
    access_note:(document.getElementById('gcm-access-note').value||'').trim(),
    desc:(document.getElementById('gcm-desc').value||'').trim(),
    hazards:hazards,notable_locations:locs,hooks:hooks
  };
  var sys=g.catalogue_systems[gcModalTargetSys];if(!sys)return;
  if(!sys.planets)sys.planets=[];
  if(gcModalMode==='add_planet'){sys.planets.push(planet);}
  else{planet.id=(sys.planets[gcModalTargetPlanet]||{}).id||planet.id;sys.planets[gcModalTargetPlanet]=planet;}
  gcSaveToStorage();gcCloseModal();render();
  if(sys.id){gcOpenSystems.add(sys.id);var card=document.getElementById('gcs_'+sys.id);if(card)card.classList.add('open');}
  if(gcModalMode==='edit_planet')gcOpenPlanet(gcModalTargetSys,gcModalTargetPlanet);
}

function ccApplyOccBonus(pi,newPicks){
  const st=ccState;
  (st.occ_bonus_skills||[]).forEach(sk=>{if(st[sk+'_bonus']===1)st[sk+'_bonus']=0;});
  st.occ_bonus_skills=[];
  st.occupation_bonus_choice=null;
  const entry=OCC_BONUS[st.occupation];
  if(!entry){st.occ_bonus_picks=[];return;}
  if(pi===null&&!entry.fixed){st.occ_bonus_picks=[];return;}
  if(Array.isArray(entry)){
    if(pi===null||!entry[pi])return;

function ccGetRaceObj(){return ccState.race?g.races.find(r=>r.name===ccState.race):null;}

function ccGetAttrBase(ab){
  const ro=ccGetRaceObj();
  const rs=ro&&ro.stats[CC_ATTR_RK[ab]];
  // Secondary attributes start free at 3. Before a race is chosen (ro null) fall
  // back to that default so the XP bar doesn't phantom-charge ~120 for the
  // perm-3 defaults; a selected race supplies the real per-attr base.
  const SEC_DEF={ENDURANCE:3,SPEED:3,WITS:3,WILLPOWER:3};
  const racial=rs?(+(rs.avg)||0):(ro?0:(SEC_DEF[ab]||0));
  const bg=BG_GRANTS[ccState.background]||{};
  return racial+((bg.attrs&&bg.attrs[ab])||0);
}

function ccRecalcHealthMorale(){
  const st=ccState;const bg=BG_GRANTS[st.background]||{};

}

function ccSetAttrPerm(ab,val){

function ccUpdateBgGrantedXP(){
  const st=ccState;const bg=BG_GRANTS[st.background]||{};

  if(bg.skills)Object.values(bg.skills).forEach(r=>{xp+=r*(r+1)/2;});
  if(bg.all_skills){const r=bg.all_skills;xp+=CC_ALL_SKILLS.length*r*(r+1)/2;}
  if(bg.choice_skills&&st.bg_choice_done){
    bg.choice_skills.forEach((c,idx)=>{
      const done=st.bg_choice_done[idx]||[];
      done.forEach(()=>{xp+=c.rank*(c.rank+1)/2;});
    });
  }

}

function ccBgChoicePick(choiceIdx,sk){
  const st=ccState;const bg=BG_GRANTS[st.background]||{};
  const choice=bg.choice_skills&&bg.choice_skills[choiceIdx];if(!choice)return;
  if(!st.bg_choice_done)st.bg_choice_done={};

    done.push(sk);st.bg_choice_done[choiceIdx]=done;

  }

function ccApplyBgTalentsEvos(bgName){

  ccState.talents=ccState.talents.filter(t=>!t.bg_granted);

  if(bg.talents){

      if(found)ccState.talents.push({...found,credited:true,bg_granted:true});

  if(!ccState.bg_talent_choice_done)ccState.bg_talent_choice_done={};
  const done=[...(ccState.bg_talent_choice_done[choiceIdx]||[])];
  // Remove previously chosen talents for this choice slot
  ccState.talents=ccState.talents.filter(t=>!(t.bg_granted&&t.bg_choice_idx===choiceIdx));
  if(done.includes(talentName)){
    ccState.bg_talent_choice_done[choiceIdx]=done.filter(n=>n!==talentName);
  } else if(done.length<choice.count){
    done.push(talentName);ccState.bg_talent_choice_done[choiceIdx]=done;
    const found=ccLookupTalent(talentName);
    if(found)ccState.talents.push({...found,credited:true,bg_granted:true,bg_choice_idx:choiceIdx});
  }
  render();
}

function ccAttrXPCost(base,cur){
  if(base===cur)return 0;
  let xp=0;
  if(base<0&&cur<=0){xp=(cur-base)*5;}
  else if(base<0&&cur>0){xp=(-base*5)+(5*cur*(cur+1)/2);}
  else{xp=5*(cur*(cur+1)/2)-5*(base*(base+1)/2);}
  return Math.max(0,xp);
}

function ccCalcAttrXP(){
  return CC_ATTR_KEYS.reduce((s,ab)=>{
    return s+ccAttrXPCost(ccGetAttrBase(ab),+(ccState[ab+'_perm'])||0);
  },0);
}

function ccCalcSpentXP(){
  let s=ccCalcAttrXP();
  CC_ALL_SKILLS.forEach(sk=>{const v=ccState[sk]||0;s+=v*(v+1)/2;});
  return s;
}

function ccApplyRaceDefaults(raceObj){
  if(!raceObj)return;
  CC_ATTR_KEYS.forEach(ab=>{
    const rs=raceObj.stats[CC_ATTR_RK[ab]];
    if(rs){const avg=+(rs.avg)||0;ccState[ab+'_base']=avg;ccState[ab+'_perm']=avg;}
  });
  // Re-apply bg attr bonuses so perm >= base
  CC_ATTR_KEYS.forEach(ab=>{
    const base=ccGetAttrBase(ab);
    if((ccState[ab+'_perm']||0)<base)ccState[ab+'_perm']=base;
    ccState[ab]=(ccState[ab+'_perm']||0)+(ccState[ab+'_bonus']||0);
  });
  ccRecalcHealthMorale();
}

function ccParseOccCredits(occName){
  const occ=(g.occupations||[]).find(o=>o.name===occName);
  if(!occ)return 0;
  for(const d of occ.details||[]){
    const m=d.match(/starting funds[:\s]+(\d+(?:\.\d+)?)([km]?)/i);
    if(m){
      let v=parseFloat(m[1]);
      const u=(m[2]||'').toLowerCase();
      if(u==='k')v*=1000;
      else if(u==='m')v*=1000000;
      return Math.round(v);
    }
  }
  return 0;
}

function ccBuyItem(idx){
  const st=ccState;
  const item=(g.equipment||[])[idx];if(!item)return;
  const cost=+(item.cost)||0;
  const remaining=(+(st.credits)||0)-(+(st.credits_spent)||0);
  if(cost>remaining&&cost>0){alert('Not enough credits (need '+fmt(cost)+', have '+fmt(remaining)+')');return;}
  // Find first empty slot in items
  let placed=false;
  for(let i=0;i<st.items.length;i++){
    if(!st.items[i].name){
      st.items[i].name=item.name||'';
      st.items[i].size=CC_SIZE_TO_VAL[item.size]||'1';
      st.items[i].qty=1;
      placed=true;break;
    }
  }
  if(!placed){
    for(let i=0;i<st.items2.length;i++){
      if(!st.items2[i].name){
        st.items2[i].name=item.name||'';
        st.items2[i].size=CC_SIZE_TO_VAL[item.size]||'1';
        st.items2[i].qty=1;
        placed=true;break;
      }
    }
  }
  if(!placed){alert('All loadout slots full.');return;}
  st.credits_spent=(+(st.credits_spent)||0)+cost;
  render();
}

function ccGetOptionsMult(opts){
  if(!opts||!opts.length)return 1;
  let mult=1;
  opts.forEach(name=>{
    const o=(g.options||[]).find(x=>x.name===name);
    if(o&&+o.cost&&+o.cost!==1)mult*=parseFloat(o.cost);
  });

function ccCalcWeaponCost(wp){
  if(!wp.base_data||!wp.name)return 0;
  const base=parseFloat(wp.base_data.cost)||0;if(!base)return 0;
  const mfr=g.manufacturers&&g.manufacturers[wp.mfr||''];
  const pm=parseFloat((mfr&&mfr.price_mult)||1)||1;
  return Math.round(base*pm*ccGetOptionsMult(wp.options))+ccMagCost(wp);

function ccCalcArmorCost(ar){
  if(!ar.base_data||!ar.name)return 0;
  const base=parseFloat(ar.base_data.cost)||0;if(!base)return 0;
  const mfr=g.manufacturers&&g.manufacturers[ar.mfr||''];
  const pm=parseFloat((mfr&&(mfr.armor_price_mult||mfr.price_mult))||1)||1;
  return Math.round(base*pm*ccGetOptionsMult(ar.options));
}
function ccCalcDatacomCost(dc){
  if(!dc.base_data||!dc.name)return 0;
  const base=parseFloat(dc.base_data.cost)||0;if(!base)return 0;
  const mfr=g.manufacturers&&g.manufacturers[dc.mfr||''];

function ccCalcEvoCreditCost(e){
  if(!e.name||e.bg_granted||e.free)return 0;
  const found=(g.evolutions&&g.evolutions.entries||[]).find(x=>x.name===e.name&&x.tier===e.tier);

function ccAutoTrackedSpent(){

      const cpuChg=pickerMfr!=='Generic'&&xd.cpu!==x.cpu;
      const memChg=pickerMfr!=='Generic'&&xd.memory!==x.memory;
      const nanChg=pickerMfr!=='Generic'&&String(xd.nanites??'')!==String(x.nanites??'');
      const dcDef=['physical','energy','tech','spiritual'].map(k=>{
        const v=xd['def_'+k];if(!v||v==='NONE')return null;
        const chg=pickerMfr!=='Generic'&&v!==(x['def_'+k]||'NONE');
        return (chg?'<b style="color:var(--a);">':'')+k.slice(0,4).toUpperCase()+':'+v+(chg?'</b>':'');
      }).filter(Boolean);
      const dcSpecStr=Array.isArray(xd.special)?xd.special.join(' '):(xd.special||'');
      const dcSpecChg=pickerMfr!=='Generic'&&dcSpecStr!==(Array.isArray(x.special)?x.special.join(' '):(x.special||''));
      const dcSizeChg=pickerMfr!=='Generic'&&(xd.size||'')!==(x.size||'');
      h+='<div style="font-size:10.5px;color:#888;">'
        +'CPU '+(cpuChg?'<b style="color:var(--gr);">':'')+esc(xd.cpu||'?')+(cpuChg?'</b>':'')
        +' | Mem '+(memChg?'<b style="color:var(--gr);">':'')+esc(xd.memory||'?')+(memChg?'</b>':'')
        +' | Nanite '+(nanChg?'<b style="color:var(--a3);">':'')+esc(xd.nanites!=null?xd.nanites:'?')+(nanChg?'</b>':'')
        +(xd.size?' | '+(dcSizeChg?'<span style="color:var(--a2);">':'')+esc(xd.size)+(dcSizeChg?'</span>':''):'')
        +(dcDef.length?' | '+dcDef.join(' '):'')
        +(dcSpecStr?' | '+(dcSpecChg?'<span style="color:var(--a3);">':'')+esc(dcSpecStr)+(dcSpecChg?'</span>':''):'')
        +'</div>';
      if(pickerMfr!=='Generic'){const availChg=xd.availability&&xd.availability!==x.availability;h+='<div style="font-size:10px;color:var(--a);">'+esc(pickerMfr)+(xd.cost?' · '+fmt(+(xd.cost)||0)+' Cr':'')+(availChg?' · <span style="color:var(--ye);">'+esc(xd.availability)+'</span>':'')+'</div>';}
    }
    else if(type==='program')h+='<div style="font-size:10.5px;color:#888;">'+esc(x.type||'')+(x.cpu?' | CPU '+x.cpu:'')+(x.memory?' | Mem '+x.memory:'')+'</div>';
    else if(type==='gadget')h+='<div style="font-size:10.5px;color:#666;margin-top:2px;">'+esc(x.desc||x.effect||'')+'</div>';
    else if(type==='software'){const _nan=(x.nanite!=null?x.nanite:(x.nanites!=null?x.nanites:null));h+='<div style="font-size:10.5px;color:#888;">'+(x._kind==='gadget'?'<span style="color:var(--a2);">Gadget</span>':esc(x.type||'Program'))+(x.cpu?' | CPU '+esc(x.cpu):'')+((x.memory!=null||x.mem!=null)?' | Mem '+esc(x.memory!=null?x.memory:x.mem):'')+(_nan!=null?' | Nanite '+esc(_nan):'')+'</div>';const _d=x.desc||x.effect||x.active||'';if(_d)h+='<div style="font-size:10.5px;color:#666;margin-top:2px;">'+esc(_d.substring(0,100))+(_d.length>100?'…':'')+'</div>';}
    else if(type==='wpn_option'||type==='armor_option'||type==='dc_option')h+='<div style="font-size:10.5px;color:#888;">×'+esc(x.cost||'1')+'cost · '+esc(x.availability||'')+'</div><div style="font-size:10.5px;color:#666;margin-top:2px;">'+esc(x.desc||'')+'</div>';
    else if(type==='background'){
      if(x.traits&&x.traits[0])h+='<div style="font-size:10.5px;color:var(--gr);line-height:1.4;margin-bottom:2px;">✓ '+esc(x.traits[0])+'</div>';
      if(x.traits&&x.traits[1])h+='<div style="font-size:10.5px;color:var(--gr);line-height:1.4;margin-bottom:2px;">✓ '+esc(x.traits[1])+'</div>';
      if(x.traits&&x.traits[2])h+='<div style="font-size:10.5px;color:var(--re);line-height:1.4;">✗ '+esc(x.traits[2])+'</div>';
    }
    else if(type==='occupation'){
      if(x.desc)h+='<div style="font-size:10.5px;color:#aaa;line-height:1.4;margin-bottom:2px;">'+esc(x.desc)+'</div>';
      if(x.details&&x.details.length)x.details.forEach(d=>{h+='<div style="font-size:10.5px;color:#777;line-height:1.4;">• '+esc(d)+'</div>';});
    }
    h+='</div>';
  });
  if(matches.length>40)h+='<div style="text-align:center;font-size:10.5px;color:#555;padding:5px;">'+matches.length+' total — refine search</div>';
  h+='</div></div>';
  return h;
}

function ccRenderOriginBlock(){
  const st=ccState;
  const cloneChosen=st.clone!==null;
  let h='<div style="border:2px solid '+(cloneChosen?'rgba(0,200,255,.3)':'var(--a)')+';border-radius:8px;padding:14px;margin-bottom:16px;background:rgba(0,200,255,.03);">';
  h+='<div style="font-family:\'Chakra Petch\',sans-serif;font-size:11px;color:var(--a);margin-bottom:10px;letter-spacing:1px;">ORIGIN — Clone or Natural Birth?</div>';
  if(!cloneChosen){
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">';
    h+='<div style="background:rgba(0,200,255,.06);border:1px solid rgba(0,200,255,.2);border-radius:6px;padding:10px;">';
    h+='<div style="font-weight:bold;color:var(--a);margin-bottom:5px;">Option A — Clone Vat</div>';
    h+='<div style="font-size:11px;color:#aaa;margin-bottom:8px;">You start as an average clone with your race\'s average attributes. Clones have a lifespan of ~10 years before needing a new body. (Cost: 2 500 000 cr — Clone, Average)</div>';
    h+='<button onclick="ccState.clone=true;ccApplyRaceDefaults(ccGetRaceObj());render();" style="background:rgba(0,200,255,.2);border:1px solid var(--a);color:var(--a);padding:5px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;">Choose Clone</button>';
    h+='</div>';
    h+='<div style="background:rgba(163,85,247,.06);border:1px solid rgba(163,85,247,.2);border-radius:6px;padding:10px;">';
    h+='<div style="font-weight:bold;color:var(--a3);margin-bottom:5px;">Option B — Natural Birth</div>';
    h+='<div style="font-size:11px;color:#aaa;margin-bottom:8px;">Your body lasts your full racial lifespan but genetic potential is random. Roll 3D10 per PRIMARY attribute — each die: 1–3 lowers min/max by 1, 4–7 no change, 8–10 raises by 1. Select a race first, then roll.</div>';
    h+='<button onclick="ccState.clone=false;ccState.nb_rolled=false;render();" style="background:rgba(163,85,247,.2);border:1px solid var(--a3);color:var(--a3);padding:5px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;">Choose Natural Birth</button>';
    h+='</div></div>';
  } else {
    const label=st.clone?'Clone Vat':'Natural Birth';
    const col=st.clone?'var(--a)':'var(--a3)';
    h+='<div style="display:flex;align-items:center;gap:12px;">';
    h+='<span style="color:'+col+';font-weight:bold;font-size:13px;">'+(st.clone?'🧬':'🌱')+' '+label+'</span>';
    if(!st.clone){
      if(!st.nb_rolled||!st.race){
        h+='<button onclick="ccRollNaturalBirth();" style="background:rgba(163,85,247,.2);border:1px solid var(--a3);color:var(--a3);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;">';
        h+=(st.race?'🎲 Roll Attributes':'Select a race first then roll')+'</button>';
      } else {
        h+='<div style="display:flex;gap:10px;flex-wrap:wrap;">';
        ['PHYSICAL','MENTAL','SOCIAL','ACUITY'].forEach(ab=>{
          const v=st.attr_variance[ab]||{};
          const ro=ccGetRaceObj();const rs=ro&&ro.stats[CC_ATTR_RK[ab]];
          const rMin=rs?+(rs.min)||0:0;const rMax=rs?+(rs.max)||0:0;
          const pMin=rMin+(v.minVar||0);const pMax=rMax+(v.maxVar||0);
          h+='<span style="font-size:11px;font-family:\'JetBrains Mono\',monospace;color:#aaa;">'+ab.slice(0,4)+': <b style="color:var(--a3);">'+pMin+'/'+pMax+'</b></span>';
        });
        h+='</div>';
        h+='<button onclick="ccRollNaturalBirth();" style="background:rgba(163,85,247,.1);border:1px solid rgba(163,85,247,.3);color:var(--a3);padding:2px 8px;border-radius:4px;cursor:pointer;font-size:10.5px;">Re-roll</button>';
      }
    }
    h+='<button onclick="ccState.clone=null;ccState.attr_variance={};ccState.nb_rolled=false;render();" style="margin-left:auto;background:none;border:1px solid #444;color:#666;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:10.5px;">Change</button>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

      const chosen=st.occupation_bonus_choice;
      const picks=st.occ_bonus_picks||[];
      h+='<div style="background:rgba(255,107,53,.06);border:1px solid rgba(255,107,53,.25);border-radius:4px;padding:8px;margin-bottom:8px;">';
      if(Array.isArray(occBonusEntry)){

        h+='<div style="font-size:10.5px;color:#bbb;margin-top:3px;">+1 on: '+occBonusEntry.fixed.map(s=>esc(s.replace(/_/g,' '))).join(', ')+'</div>';
      } else if(!occBonusEntry.fixed&&occBonusEntry.pick){
        h+='<div style="font-size:10.5px;color:var(--a2);margin-bottom:6px;font-family:\'Chakra Petch\',sans-serif;">SKILL BONUS — Pick '+occBonusEntry.pick+' ('+picks.length+'/'+occBonusEntry.pick+')</div>';
        h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;">';
        occBonusEntry.from.forEach(sk=>{

        });

      } else if(occBonusEntry.fixed&&occBonusEntry.pick){
        h+='<div style="font-size:10.5px;color:var(--a2);margin-bottom:5px;font-family:\'Chakra Petch\',sans-serif;">SKILL BONUS — Fixed + choose one</div>';
        h+='<div style="font-size:10.5px;color:var(--gr);margin-bottom:5px;">✓ Auto-applied: '+occBonusEntry.fixed.map(s=>esc(s.replace(/_/g,' '))).join(', ')+'</div>';
        h+='<div style="font-size:10.5px;color:#888;margin-bottom:4px;">Additionally, choose one:</div>';
        occBonusEntry.from.forEach((sk,si)=>{
          const isChosen=chosen===si;
          h+='<button onclick="ccApplyOccBonus('+si+');render();" style="display:inline-block;margin-right:4px;background:'+(isChosen?'rgba(255,107,53,.25)':'rgba(0,0,0,.3)')+';border:1px solid '+(isChosen?'var(--a2)':'rgba(255,255,255,.1)')+';color:'+(isChosen?'var(--a2)':'#aaa')+';padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px;">'+(isChosen?'✓ ':'')+esc(sk.replace(/_/g,' '))+'</button>';
        });
        if(chosen!==null&&chosen!==undefined)h+='<div style="font-size:10px;color:var(--a2);margin-top:4px;">+1 on: '+[...occBonusEntry.fixed,...[occBonusEntry.from[chosen]]].map(s=>esc(s.replace(/_/g,' '))).join(', ')+'</div>';
      }
      h+='</div>';
    }
    h+=ccLbl('Occupation Notes','<textarea style="'+CC_INP+'height:50px;resize:vertical;" oninput="ccState.occupation_desc=this.value;">'+esc(st.occupation_desc||'')+'</textarea>');
    h+='</div>';
  }
  // Racial traits box
  if(raceObj){
    h+='<div style="margin-top:10px;background:rgba(0,200,255,.02);border:1px solid rgba(0,200,255,.18);border-radius:6px;padding:12px;">';
    h+=ccSecHead('RACIAL TRAITS — '+esc(st.race),'var(--a)');
    const traitDefs=[['Racial Ability','var(--a)',raceObj.racial],['Evolution Ability','var(--a3)',raceObj.evolution],['Environment Trait','var(--gr)',raceObj.environment]];
    traitDefs.forEach(([lbl,col,txt])=>{
      if(!txt)return;
      h+='<div style="margin-bottom:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:8px 10px;">';
      h+='<div style="font-size:10px;color:'+col+';font-family:\'Chakra Petch\',sans-serif;margin-bottom:4px;">'+lbl+'</div>';
      h+='<div style="font-size:11px;color:#ccc;line-height:1.5;">'+esc(txt)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  // Evolution attribute notes (T4-B)
  const ATTR_KEYWORDS=['PHYSICAL','MENTAL','SOCIAL','ACUITY','ENDURANCE','SPEED','WITS','WILLPOWER','ATTRIBUTE','attribute'];
  const evoAttrNotes=st.evolutions.filter(e=>e.name&&e.effect&&ATTR_KEYWORDS.some(kw=>e.effect.includes(kw)));
  if(evoAttrNotes.length){
    h+='<div style="margin-top:10px;background:rgba(168,85,247,.03);border:1px solid rgba(168,85,247,.2);border-radius:6px;padding:12px;">';
    h+=ccSecHead('EVOLUTION ATTRIBUTE NOTES','var(--a3)');
    h+='<div style="font-size:10.5px;color:#888;margin-bottom:6px;">Active evolutions with attribute effects — apply bonuses manually in the attribute table above.</div>';
    h+='<div style="display:flex;flex-direction:column;gap:6px;">';
    evoAttrNotes.forEach(e=>{
      h+='<div style="background:rgba(0,0,0,.25);border:1px solid rgba(168,85,247,.2);border-radius:4px;padding:7px 10px;">';
      h+='<div style="font-size:11px;color:var(--a3);font-weight:bold;margin-bottom:3px;">'+esc(e.name)+(e.tier?' <span style="font-size:10px;color:#888;">'+esc(e.tier)+'</span>':'')+'</div>';
      h+='<div style="font-size:10.5px;color:#bbb;line-height:1.4;">'+esc(e.effect)+'</div>';
      h+='</div>';
    });
    h+='</div></div>';
  }
  return h;
}

function ccRenderAttributes(){

  ccRecalcHealthMorale();

  h+='<th style="width:80px;padding:4px;">Perm<br><span style="font-size:10px;color:#444;">XP-bought</span></th>';
  h+='<th style="width:120px;padding:4px;">Bonus<br><span style="font-size:10px;color:#444;">circumstantial</span></th>';
  h+='<th style="width:55px;padding:4px;">Final<br><span style="font-size:10px;color:#444;">perm+bonus</span></th>';

  h+='</tr>';
  ABS.forEach(ab=>{
    const base=ccGetAttrBase(ab);

    const bonus=+(st[ab+'_bonus'])||0;
    const final_v=perm+bonus;
    const rs=raceObj&&raceObj.stats[CC_ATTR_RK[ab]]?raceObj.stats[CC_ATTR_RK[ab]]:null;
    const xpCost=ccAttrXPCost(base,perm);
    const bgBonus=(BG_GRANTS[st.background]||{}).attrs;
    const hasBgBonus=bgBonus&&bgBonus[ab];
    h+='<tr style="border-top:1px solid rgba(255,255,255,.06);">';
    h+='<td style="padding:5px 8px;font-family:\'Chakra Petch\',sans-serif;font-size:11px;color:var(--a);">'+ab+'</td>';
    // Base — read-only
    h+='<td style="padding:3px 4px;text-align:center;">';
    h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:15px;color:'+(hasBgBonus?'var(--ye)':'var(--a3)')+';font-weight:bold;">'+base+'</div>';
    if(hasBgBonus)h+='<div style="font-size:10px;color:var(--ye);">+'+bgBonus[ab]+' bg</div>';
    h+='</td>';
    // Perm — editable onchange
    h+='<td style="padding:3px 4px;text-align:center;">';
    h+='<input type="number" value="'+perm+'" style="width:56px;background:rgba(0,0,0,.4);border:1px solid rgba(0,200,255,.22);color:var(--tx);padding:3px;text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:13px;" onchange="ccSetAttrPerm(\''+ab+'\',this.value);">';
    if(xpCost>0)h+='<div style="font-size:10px;color:var(--a2);">'+xpCost+' xp</div>';
    h+='</td>';
    // Bonus dropdown
    h+='<td style="padding:3px 4px;text-align:center;"><select style="'+CC_SEL+'" onchange="ccSetAttrBonus(\''+ab+'\',this.value);">';
    [['None',0],['Small Bonus +1',1],['Large Bonus +3',3],['Small Penalty −1',-1],['Large Penalty −3',-3]].forEach(([lbl,val])=>{
      h+='<option value="'+val+'"'+(bonus===val?' selected':'')+'>'+lbl+'</option>';
    });
    h+='</select></td>';
    // Final value
    h+='<td style="padding:3px 4px;text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:16px;font-weight:bold;color:var(--tx);">'+final_v+'</td>';
    // Racial range
    if(raceObj){
      h+='<td style="padding:3px 8px;text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:11px;">';
      if(rs){
        const isNB=st.clone===false&&st.nb_rolled;
        const PRIMARY_ATTRS_RK=['physical','mental','social','acuity'];
        const rk=CC_ATTR_RK[ab];
        const bgGrant=BG_GRANTS[st.background]||{};
        const noMax=bgGrant.no_racial_max;
        const attrMod=(bgGrant.attr_max_mods&&bgGrant.attr_max_mods[ab])||0;
        let minV=esc(rs.min),maxV=esc(rs.max);
        if(isNB&&PRIMARY_ATTRS_RK.includes(rk)&&st.attr_variance[ab]){
          const v=st.attr_variance[ab];
          minV='<span style="color:var(--a3);">'+(+(rs.min||0)+(v.minVar||0))+'</span>';
          maxV='<span style="color:var(--a3);">'+(+(rs.max||0)+(v.maxVar||0))+'</span>';
        }
        if(noMax)maxV='<span style="color:var(--ye);" title="No racial maximum (Subject 0056)">∞</span>';
        else if(attrMod){const adjMax=+(rs.max||0)+(isNB&&PRIMARY_ATTRS_RK.includes(rk)&&st.attr_variance[ab]?(st.attr_variance[ab].maxVar||0):0)+attrMod;maxV='<span style="color:var(--re);" title="Racial max reduced by background ('+attrMod+')">'+adjMax+'</span>';}
        h+=minV+' / <b style="color:var(--a);">'+esc(rs.avg)+'</b> / '+maxV;
      } else {
        h+='<span style="color:#444;">—</span>';
      }
      h+='</td>';
    }
    h+='</tr>';
  });
  h+='</table>';
  // Health/Morale/CHI — max values auto-calculated, current values editable
  const bg_obj=BG_GRANTS[st.background]||{};
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;">';
  h+='<div>'+ccSecHead('HEALTH & MORALE');
  h+='<div style="font-size:10.5px;color:#666;margin-bottom:6px;">Max HP = 10 + END · Max Morale = 10 + WILL · CHI = 5</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">';
  const hpMax=st.HEALTH_max,mMax=st.MORALE_max,chiMax=st.CHI_max;
  [['HEALTH','HP Curr',false],['HEALTH_max','HP Max ✦',true,hpMax],['MORALE','Morale',false],['MORALE_max','Morale Max ✦',true,mMax],['CHI','CHI',false],['CHI_max','CHI Max ✦',true,chiMax]].forEach(([k,lbl,auto,autoVal])=>{
    h+='<div><div style="font-size:10.5px;color:#888;margin-bottom:2px;">'+lbl+'</div>';
    if(auto){
      h+='<div style="background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:var(--gr);padding:4px;text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:13px;border-radius:3px;">'+autoVal+'</div>';
    } else {
      h+='<input type="number" value="'+(+(st[k])||0)+'" style="width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(0,200,255,.22);color:var(--tx);padding:4px;text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:13px;box-sizing:border-box;" oninput="ccState[\''+k+'\']=+this.value||0;">';
    }
    h+='</div>';
  });
  if(bg_obj.health||bg_obj.morale||bg_obj.chi||bg_obj.chi_lock||bg_obj.surge_lock){
    h+='<div style="grid-column:1/-1;font-size:10.5px;color:var(--ye);">Background: ';
    if(bg_obj.health)h+='+'+bg_obj.health+' HP ';
    if(bg_obj.morale)h+='+'+bg_obj.morale+' Morale ';
    if(bg_obj.chi)h+='+'+bg_obj.chi+' CHI ';
    if(bg_obj.chi_lock)h+='<span style="color:var(--re);">CHI MAX locked at 0 </span>';
    if(bg_obj.surge_lock)h+='<span style="color:var(--re);">SURGE MAX locked at 0 </span>';
    h+='</div>';
  }
  h+='</div></div>';
  h+='<div>'+ccSecHead('INITIATIVE');
  h+='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">';
  [['init_move','Move'],['init_standard','Standard'],['init_quick','Quick'],['init_complex','Complex']].forEach(([k,lbl])=>{
    h+='<div><div style="font-size:10.5px;color:#888;margin-bottom:2px;">'+lbl+'</div><input type="text" value="'+esc(st[k]||'')+'" placeholder="e.g. 4" style="'+CC_INP+'" oninput="ccState[\''+k+'\']=this.value;"></div>';
  });
  h+='</div></div></div>';
  // T4-B: Active evolution attribute notes
  const ATTR_KEYWORDS=['PHYSICAL','MENTAL','SOCIAL','ACUITY','ENDURANCE','SPEED','WITS','WILLPOWER','ATTRIBUTE','attribute'];
  const evoAttrNotes=st.evolutions.filter(e=>e.name&&e.effect&&ATTR_KEYWORDS.some(kw=>e.effect.includes(kw)));
  if(evoAttrNotes.length){
    h+=ccSecHead('EVOLUTION ATTRIBUTE NOTES','var(--a3)');
    h+='<div style="font-size:10.5px;color:#888;margin-bottom:6px;">Active evolutions with attribute effects (display only — apply bonuses manually in the table above).</div>';
    h+='<div style="display:flex;flex-direction:column;gap:6px;">';
    evoAttrNotes.forEach(e=>{
      h+='<div style="background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.25);border-radius:4px;padding:7px 10px;">';
      h+='<div style="font-size:11px;color:var(--a3);font-weight:bold;margin-bottom:3px;">'+esc(e.name)+(e.tier?' <span style="font-size:10px;color:#888;">'+esc(e.tier)+'</span>':'')+'</div>';
      h+='<div style="font-size:10.5px;color:#bbb;line-height:1.4;">'+esc(e.effect)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  return h;
}

function ccRenderSkills(){
  const st=ccState;
  const spent=ccCalcSpentXP();
  const bgXP=+(st.bg_granted_xp)||0;
  const avail=(+(st.total_xp)||0)+(+(st.credited_xp)||0)+bgXP-spent;
  let h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
  h+='<div style="font-family:\'Chakra Petch\',sans-serif;font-size:12px;color:var(--a);">SKILLS</div>';
  h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;">Spent: <span style="color:var(--a2);">'+spent+'</span> | Available: <span style="color:'+(avail>=0?'var(--gr)':'var(--re)')+';">'+avail+'</span> | <span style="font-size:10.5px;color:#666;">Cost = N×(N+1)÷2 · Click skill name to expand</span></div>';
  h+='</div>';
  // Background skill choices pending
  const bgChoices=st.bg_choices||[];
  const bg=BG_GRANTS[st.background]||{};
  const pendingChoices=bgChoices.filter(c=>{
    const done=(st.bg_choice_done||{})[c.idx]||[];
    return done.length<c.count;
  });
  if(pendingChoices.length>0){
    h+='<div style="background:rgba(255,200,0,.07);border:1px solid var(--ye);border-radius:6px;padding:10px;margin-bottom:14px;">';
    h+='<div style="font-size:12px;color:var(--ye);font-weight:bold;margin-bottom:8px;">⚠ Background Choices Pending — '+esc(st.background)+'</div>';
    pendingChoices.forEach(c=>{
      const done=(st.bg_choice_done||{})[c.idx]||[];
      const remaining=c.count-done.length;
      h+='<div style="margin-bottom:8px;">';
      h+='<div style="font-size:11px;color:#ccc;margin-bottom:5px;">'+esc(c.label)+' <span style="color:#888;">('+remaining+' more to choose)</span></div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:4px;">';
      const opts=c.from?({'PHYSICAL':CC_SKILLS_PHYS,'MENTAL':CC_SKILLS_MENT,'SOCIAL':CC_SKILLS_SOCI,'ACUITY':CC_SKILLS_ACUI}[c.from]||[]):( c.options||[]);
      opts.forEach(sk=>{
        const picked=done.includes(sk);
        h+='<button onclick="ccBgChoicePick('+c.idx+',\''+sk+'\');" style="background:'+(picked?'rgba(255,200,0,.3)':'rgba(0,0,0,.4)')+';border:1px solid '+(picked?'var(--ye)':'rgba(255,255,255,.2)')+';color:'+(picked?'var(--ye)':'#aaa')+';padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;">'+(picked?'✓ ':'')+sk.replace(/_/g,' ')+'</button>';
      });
      h+='</div></div>';
    });
    h+='</div>';
  }
  // Get bg fixed/all skill grants for indicator
  const bgSkGrants={};
  if(bg.skills)Object.entries(bg.skills).forEach(([sk,r])=>{bgSkGrants[sk]=r;});
  if(bg.all_skills)CC_ALL_SKILLS.forEach(sk=>{bgSkGrants[sk]=bg.all_skills;});
  if(bg.choice_skills)(st.bg_choice_done?bg.choice_skills.forEach((c,idx)=>{const done=(st.bg_choice_done[idx]||[]);done.forEach(sk=>{bgSkGrants[sk]=c.rank;});}):null);
  const CRIT_OPTS=['10','9-10','8-10','7-10','6-10','5-10','4-10','3-10','2-10','1-10'];
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">';
  [['Physical',CC_SKILLS_PHYS,'PHYSICAL'],['Mental',CC_SKILLS_MENT,'MENTAL'],['Social',CC_SKILLS_SOCI,'SOCIAL'],['Acuity',CC_SKILLS_ACUI,'ACUITY']].forEach(([grp,skills,ab])=>{
    h+='<div>';
    h+='<div style="font-family:\'Chakra Petch\',sans-serif;font-size:11px;color:var(--a);margin-bottom:8px;text-align:center;background:rgba(0,200,255,.08);padding:4px 2px;border-radius:3px;">'+grp+'<span style="font-size:10px;color:#666;display:block;">'+ab+'</span></div>';
    skills.forEach(sk=>{
      const v=+(st[sk])||0;const cost=v*(v+1)/2;
      const expanded=!!(st.sk_expanded&&st.sk_expanded[sk]);
      const isBgGrant=bgSkGrants[sk]&&v<=bgSkGrants[sk];
      const skCrit=st[sk+'_crit']||'10';
      const skBonus=+(st[sk+'_bonus'])||0;

        CRIT_OPTS.forEach(opt=>{h+='<option value="'+opt+'"'+(skCrit===opt?' selected':'')+'>'+opt+'</option>';});
        h+='</select></div>';
        h+='<div><div style="font-size:10px;color:#666;margin-bottom:2px;">Modifier</div>';
        h+='<select style="background:#111;border:1px solid rgba(0,200,255,.2);color:var(--tx);padding:2px 4px;font-size:10.5px;" onchange="ccState[\''+sk+'_bonus\']=+this.value;">';
        [['None',0],['Small +1',1],['Large +3',3],['Small −1',-1],['Large −3',-3]].forEach(([lbl,val])=>{
          h+='<option value="'+val+'"'+(skBonus===val?' selected':'')+'>'+lbl+'</option>';
        });
        h+='</select></div></div></div>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

// ── Talent point helpers ──────────────────────────────────────────────────────
const CC_TALENT_CATS={
  PHYSICAL:CC_SKILLS_PHYS,MENTAL:CC_SKILLS_MENT,
  SOCIAL:CC_SKILLS_SOCI,ACUITY:CC_SKILLS_ACUI
};
function ccTalentPoints(cat){
  return (CC_TALENT_CATS[cat]||[]).reduce((s,sk)=>s+(ccState[sk]||0),0);
}
function ccTalentUsed(cat){
  return ccState.talents.filter(t=>t.name&&!t.bg_granted&&(t.category||'').toUpperCase()===cat)
    .reduce((s,t)=>s+(+(t.xp_cost)||0),0);
}

// ── Evolution helpers ─────────────────────────────────────────────────────────
function ccEvoTierCost(tier){
  const t=(tier||'').toUpperCase();
  if(t.includes('III')||t==='3')return 3;
  if(t.includes('II')||t==='2')return 2;
  return 1;
}
function ccEvoUsed(){
  return ccState.evolutions.reduce((s,e)=>s+(e.name&&!e.free?ccEvoTierCost(e.tier):0),0);
}
function ccEvoSoftCap(){
  return (+(ccState.ENDURANCE)||0)+(+(ccState.WILLPOWER)||0);
}
function ccEvoHasPrereq(evo,idx){
  if(!evo.name)return true;
  if(evo.bg_granted)return true;
  const t=(evo.tier||'').toUpperCase();
  if(!t.includes('II')&&!t.includes('III')&&t!=='2'&&t!=='3')return true; // TIER I always OK
  const needTier=t.includes('III')||t==='3'?'II':'I';
  return ccState.evolutions.some((e,i)=>i!==idx&&e.name===evo.name&&(e.tier||'').toUpperCase().includes(needTier));
}

/* ── CC gear display helpers (Milestone 21.0) ─────────────────────────────────
   Picked catalogue items render as STATIC read-only cards; a ✎ Modify button
   flips a slot to `custom:true` and shows the editable form. Power/legality/def
   show as named tiers (never hidden numbers). Ammo weapons get a magazine row. */
function ccLegCls(l){l=(l||'').toLowerCase();if(l.indexOf('illegal')>=0)return 'tr';if(l.indexOf('restrict')>=0)return 'ty';if(l.indexOf('classif')>=0)return 'tp';return 'tw';}
const CC_PWR_CLS={'Low':'tg','Medium':'to','High':'ty','Extreme':'tr','EXTREME':'tr','LOC':'tp','LOC+1':'tp'};
const CC_DEF_CLS={None:'tgr',Low:'tg',Medium:'to',High:'ty',Extreme:'tr'};
// Weapon base_data.ammo is "count / cat" (e.g. "3 / HM"); cat maps to g.ammo_types[].cat.
function ccWpnAmmoInfo(w){
  const raw=(w&&w.base_data&&w.base_data.ammo)||'';
  const m=/^\s*(\d+)\s*\/\s*(\S+)/.exec(String(raw));
  if(!m)return null;
  const cat=m[2];
  const mag=(g.ammo_types||[]).find(a=>String(a.cat).toUpperCase()===cat.toUpperCase())||null;
  return {cat:cat,per:+m[1]||0,mag:mag};
}
// per-magazine price = base magazine cost × Π(selected ammo-option cost multipliers)
function ccMagUnitCost(w){const info=ccWpnAmmoInfo(w);if(!info||!info.mag)return 0;let c=parseFloat(info.mag.cost)||0;(w.ammo_opts||[]).forEach(code=>{const o=(g.ammo_opts||[]).find(x=>x.code===code);if(o)c*=(+o.cost_mult||1);});return Math.round(c);}
function ccMagCost(w){return Math.max(0,+(w.magazines)||0)*ccMagUnitCost(w);}
function ccMagAdj(i,d){const w=ccState.weapons[i];if(!w)return;w.magazines=Math.max(0,(+(w.magazines)||0)+d);render();}
// toggle a custom-munition option (respects type + mutual AMMO_COMPAT gating at click time)
function ccMagOpt(i,code){const w=ccState.weapons[i];if(!w)return;w.ammo_opts=w.ammo_opts||[];const k=w.ammo_opts.indexOf(code);if(k>=0)w.ammo_opts.splice(k,1);else w.ammo_opts.push(code);render();}
function ccMagRow(w,i){
  const info=ccWpnAmmoInfo(w);if(!info)return '';
  const btn='width:20px;height:20px;border-radius:3px;cursor:pointer;font-size:12px;line-height:1;background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.35);color:var(--a2);';
  let h='<div style="margin:5px 0;padding:6px 8px;background:rgba(255,107,53,.06);border:1px solid rgba(255,107,53,.18);border-radius:3px;font-size:11px;">';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">';
  h+='<span style="color:#777;font-family:\'Chakra Petch\',sans-serif;">AMMO</span>';
  h+='<span style="color:var(--tx);">'+info.per+' rounds / magazine</span>';
